# =====================================================================
# Deploy Cortex 7 (Dataform) via runner interno do GitLab
# Fonte da verdade: git.tramontina.net/databricks/cortex
#   develop -> DEV  (tra-prd-cortex-aecorsoft)
#   main    -> PROD (tra-prd-cortex)
#
# AUTENTICAÇÃO: chave JSON de service account em BASE64, guardada em
# variável CI/CD protegida + mascarada (Settings > CI/CD > Variables):
#   GCP_SA_KEY_DEV_B64   -> base64 do JSON da SA do projeto DEV
#   GCP_SA_KEY_PROD_B64  -> base64 do JSON da SA do projeto PROD
#
# Para gerar o base64 da chave (no seu PC/Cloud Shell):
#   Linux/Mac : base64 -w0 sa-dataform-exec.json
#   PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("sa.json"))
# =====================================================================
image: google/cloud-sdk:slim
stages: [compile, deploy]

variables:
  DATAFORM_VERSION: "3.0.64"
  BQ_LOCATION: "US"
  CUSTOMER_ACTION: "sap_customers_customers"

.setup: &setup
  - echo "=== DEBUG: tamanho da variavel ==="
  - echo -n "${SA_KEY_B64}" | wc -c
  - echo "=== DEBUG: primeiros caracteres da variavel (deve ser ewogIC...) ==="
  - echo -n "${SA_KEY_B64}" | head -c 20 ; echo ""
  - echo "=== DEBUG: decodificando ==="
  - echo "${SA_KEY_B64}" | base64 -d > /tmp/sa-key.json 2>&1 || echo "ERRO no base64 -d"
  - echo "=== DEBUG: tamanho do arquivo decodificado ==="
  - wc -c < /tmp/sa-key.json
  - echo "=== DEBUG: primeiro caractere do JSON (deve ser {) ==="
  - head -c 30 /tmp/sa-key.json ; echo ""
  - gcloud auth activate-service-account --key-file=/tmp/sa-key.json
  - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json
  - gcloud config set project "${GCP_PROJECT}"
  - apt-get update -y && apt-get install -y nodejs npm python3 python3-pip curl >/dev/null
  - npm i -g @dataform/cli@${DATAFORM_VERSION}
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - uv sync
  - cp "${CORTEX_CONFIG_FILE}" config/config.yaml
  - uv run cortex-build --config "config/config.yaml" --output-dir "build_out"

compile:
  stage: compile
  tags:
    - deploy  
  variables:
    SA_KEY_B64: "${GCP_SA_KEY_DEV_B64}"
    GCP_PROJECT: "tra-prd-cortex-aecorsoft"
    CORTEX_CONFIG_FILE: "${CORTEX_CONFIG_DEV}"
  script:
    - *setup
    - cd build_out && dataform compile
  after_script:
    - rm -f /tmp/sa-key.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_dev:
  stage: deploy
  tags:
    - deploy  
  variables:
    SA_KEY_B64: "${GCP_SA_KEY_DEV_B64}"
    GCP_PROJECT: "tra-prd-cortex-aecorsoft"
    CORTEX_CONFIG_FILE: "${CORTEX_CONFIG_DEV}"
  script:
    - *setup
    - cd build_out
    - dataform run --actions "${CUSTOMER_ACTION}" --default-location ${BQ_LOCATION}
  after_script:
    - rm -f /tmp/sa-key.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  environment:
    name: dev

deploy_prod:
  stage: deploy
  tags:
    - deploy  
  variables:
    SA_KEY_B64: "${GCP_SA_KEY_PROD_B64}"
    GCP_PROJECT: "tra-prd-cortex"
    CORTEX_CONFIG_FILE: "${CORTEX_CONFIG_PROD}"
  script:
    - *setup
    - cd build_out
    - dataform run --actions "${CUSTOMER_ACTION}" --default-location ${BQ_LOCATION}
  after_script:
    - rm -f /tmp/sa-key.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: prod
