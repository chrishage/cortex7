description: "This view stores the configurations for various stock characteristics (blocked, restricted etc) and their associated movement types. The granularity is at Client(System), Stock Type, Debit/Credit Indicator, Special Stock Indicator and Movement Type"
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "StockType_INSMK"
    description: "Stock Type, PK"
  - name: "Debit_CreditIndicator_SHKZG"
    description: "Debit/Credit indicator, PK"
  - name: "SpecialStockIndicator_SOBKZ"
    description: "Special Stock Indicator, PK"
  - name: "MovementType_BWART"
    description: "Movement Type, PK"
  - name: "StockCharacteristic"
    description: "The characteristics/categories of Inventory the materials are moving into/out of"
