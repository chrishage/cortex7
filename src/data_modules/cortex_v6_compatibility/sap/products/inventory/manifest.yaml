displayName: Cortex V6 Compatibility Inventory
description: Backward-compatible Inventory data product from Cortex V6.
type: inventory
category: consumption_product
dependencies:
  sapMasterData:
    modulePath: cortex_v6_compatibility.sap.products.master_data
  sapSales:
    modulePath: cortex_v6_compatibility.sap.products.sales
  sapModule:
    modulePath: cortex.sap.foundations.sap
    supportedVersions:
      - ecc
      - s4
    tables:
      common:
        - mbew
        - marc
        - t001w
        - t001k
        - t001
        - t001l
        - mara
        - makt
        - tcurx
        - tcurr
        - t002
        - mseg
        - mard
        - vbak
        - vbap
        - vbfa
        - matdoc
        - mska
        - msfd
        - mslb
        - msku
        - mkol

builder: sap_product
