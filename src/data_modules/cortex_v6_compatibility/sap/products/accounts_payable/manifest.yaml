displayName: Cortex V6 Compatibility Accounts Payable
description: Backward-compatible Accounts Payable data product from Cortex V6.
type: accounts_payable
category: consumption_product
dependencies:
  sapMasterData:
    modulePath: cortex_v6_compatibility.sap.products.master_data
  sapFinance:
    modulePath: cortex_v6_compatibility.sap.products.finance
  sapPurchasing:
    modulePath: cortex_v6_compatibility.sap.products.purchasing
  sapModule:
    modulePath: cortex.sap.foundations.sap
    supportedVersions:
      - ecc
      - s4
    tables:
      common:
        - bkpf
        - bseg
        - t001
        - lfa1
        - adrc
        - tcurx
        - tcurr
        - t002
        - rseg
        - rbco
        - rbkp
builder: sap_product
