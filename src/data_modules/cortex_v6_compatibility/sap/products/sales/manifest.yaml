        - vbap
        - vbpa
        - vbrk
        - vbrp
        - t001
        - kna1
        - mara
        - makt
        - tcurx
        - tcurr
        - t002
        - likp
        - lips
        - vbep
        - but020
        - tcurc
        - tcurt
        - dd07t
        - tvko
        - tvkot
        - vbfa
builder: sap_product


