description: "MaterialPlantsMD view contains material plant master data which shows information for each plant along with their different indicators and statuses like Safety stock, valuation category/area, etc. at the granularity of Client(System), Material Number and Plant"
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "MaterialNumber_MATNR"
    description: "Material Number, PK"
  - name: "Plant_WERKS"
    description: "Plant, PK"
  - name: "MaintainanceStatus_PSTAT"
    description: "Maintainance Status"
  - name: "FlagMaterialForDeletionAtPlantLevel_LVORM"
    description: "Flag Material For Deletion At Plant Level"
  - name: "ValuationCategory_BWTTY"
    description: "Valuation Category"
  - name: "BatchManagementIndicator_XCHAR"
    description: "Batch Management Indicator (internal)"
  - name: "PlantSpecificMaterialStatus_MMSTA"
    description: "Plant-Specific Material Status"
  - name: "DateFromWhichThePlantsSpecificMaterialStatusIsValid_MMSTD"
    description: "Date from which the plants-pecific material status is valid"
  - name: "SafetyStock_EISBE"
    description: "Safety Stock"
