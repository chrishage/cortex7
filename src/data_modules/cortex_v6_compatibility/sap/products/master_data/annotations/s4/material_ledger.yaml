description: "This view provides insights on the valuation of a material over the different periods and fiscal years it has been used, and based on these valuations, its prices are calculated. The granularity of this view is at Client(System), material number, valuation type, valuation area, posting period and fiscal year."
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "MaterialNumber_MATNR"
    description: "Material Number, PK"
  - name: "ValuationType_BWTAR"
    description: "Valuation Type, PK"
  - name: "ValuationArea_BWKEY"
    description: "Valuation Area, PK"
  - name: "PostingPeriod"
    description: "Posting Period, PK"
  - name: "FiscalYear"
    description: "Fiscal Year of the posting period, PK"
  - name: "PriceUnit_PEINH"
    description: "Price Unit"
  - name: "PriceControlIndicator_VPRSV"
    description: "Price Control Indicator"
  - name: "StandardCost_STPRS"
    description: "Standard Price"
  - name: "ValueOfTotalValuatedStock_SALK3"
    description: "Value Of Total Valuated Stock"
  - name: "MovingAveragePrice"
    description: "Moving Average Price"
  - name: "CurrencyKey_WAERS"
    description: "Currency Key"
