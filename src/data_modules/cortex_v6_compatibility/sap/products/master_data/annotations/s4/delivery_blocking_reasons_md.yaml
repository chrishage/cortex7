description: "This view provides the master data of reasons (descriptions) for various delivery blocks. The granularity is Client(System), Language key and delivery block."
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "LanguageKey_SPRAS"
    description: "Language Key, PK"
  - name: "DefaultDeliveryBlock_LIFSP"
    description: "Default Delivery Block, PK"
  - name: "DeliveryBlockReason_VTEXT"
    description: "Delivery Block Description"
