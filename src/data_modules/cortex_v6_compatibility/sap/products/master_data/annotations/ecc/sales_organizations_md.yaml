description: "This view shows sales organization master data including associated companies and other details. The granularity is Client(System), sales organization, company code and language key."
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "SalesOrg_VKORG"
    description: "Sales Organization, PK"
  - name: "CompanyCode_BUKRS"
    description: "Company Code, PK"
  - name: "Language_SPRAS"
    description: "Language Key, PK"
  - name: "SalesOrgCurrency_WAERS"
    description: "Sales Organization Currency Key"
  - name: "SalesOrgCustomer_KUNNR"
    description: "Sales Organization Customer Number"
  - name: "Country_LAND1"
    description: "Country Key"
  - name: "CoCoCurrency_WAERS"
    description: "Company Currency Key"
  - name: "FiscalYrVariant_PERIV"
    description: "Fiscal Year Variant"
  - name: "Company_BUTXT"
    description: "Name of Company"
  - name: "SalesOrgName_VTEXT"
    description: "Name of Sales Organization"
