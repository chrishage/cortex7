description: "Master data is the fundamental business data in an enterprise and defines the business objects and classifications. CompaniesMD view gives information related to different companies in the system like company code, country, name, at Granularity of Client(system), Company code and Language key."
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "CurrencyCode_WAERS"
    description: "Currency"
  - name: "CompanyCode_BUKRS"
    description: "Company Code, PK"
