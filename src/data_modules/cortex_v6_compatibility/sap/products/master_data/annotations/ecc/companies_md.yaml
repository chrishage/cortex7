    description: "Language Key, PK"
  - name: "ChartOfAccounts_KTOPL"
    description: "Chart of Accounts"
  - name: "FiscalyearVariant_PERIV"
    description: "Fiscal Year Variant"
  - name: "Company_RCOMP"
    description: "Company Information"
  - name: "CreditControlArea_KKBER"
    description: "Credit Control Area"
  - name: "CountryChartofAccounts_KTOP2"
    description: "Chart of Accounts According To Country Legislation"
  - name: "FundsManagement_FIKRS"
    description: "Funds Management Area"
