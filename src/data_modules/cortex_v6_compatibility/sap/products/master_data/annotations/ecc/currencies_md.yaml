description: "This view contains currencies master data, with information about the different currencies used by the system, including currency code, description text, decimal places, etc. This view has a granularity of Client(System), currency key and language key."
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "CurrencyCode_WAERS"
    description: "Currency Key, PK"
  - name: "Language"
    description: "Language Key, PK"
  - name: "CurrencyISO_ISOCD"
    description: "ISO Currency Code"
  - name: "CurrencyDecimals_CURRDEC"
    description: "Number of Decimal Places"
  - name: "CurrShortText_KTEXT"
    description: "Short Text for Currency Description"
  - name: "CurrLongText_LTEXT"
    description: "Long Text for Currency Description"
