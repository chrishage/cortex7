description: "This view provides description of hierarchy nodes of FSV hierarchy at the granularity of Client(System), Financial Statement Version, Language Key, Financial Statement Item, Text type and Line number of the Financial Statement Item"
fields:
  - name: "Client_MANDT"
    description: "Client (Mandant), PK"
  - name: "FinancialStatementVersion_VERSN"
    description: "FS Version, PK"
  - name: "LanguageKey_SPRAS"
    description: "Language Key, PK"
  - name: "FinancialStatementItem_ERGSL"
    description: "Financial Statement Item, PK"
  - name: "TextType_TXTYP"
    description: "Type of Node in hierarchy ( like item / group ), PK"
  - name: "FinancialStatementItemLineNumber_ZEILE"
    description: "Line Number of the Financial Statement Item, PK"
  - name: "FinancialStatementItemText_TXT45"
    description: "Description of Hierarchy Node"
