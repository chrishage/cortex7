description: Contains master records (from CKMLHD) linking a material, plant, and valuation type to a
  unique valuation header number (kalnr).
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: valuation_header_kalnr
    description: Valuation Header Number, PK
  - name: material_number_matnr
    description: Material Number
  - name: valuation_area_bwkey
    description: Valuation Area
  - name: valuation_type_bwtar
    description: Valuation Type
  - name: price_determination_control_mlast
    description: Material Price Determination Control Indicator
  - name: movement_data_exists_xabrech
    description: 'Indicator: Movements Have Occurred Since the Last Price Determination'
  - name: last_price_determination_date_abrechdat
    description: Date of the Last Successful Price Determination
  - name: last_price_determination_time_abrechuhr
    description: Time of the Last Successful Price Determination
  - name: special_stock_valuation_kzbws
    description: Valuation Indicator for Special Stock
  - name: vendor_stock_valuation_xobew
    description: Valuation Indicator for Vendor Stock
  - name: special_stock_indicator_sobkz
    description: Special Stock Indicator
  - name: sales_document_vbeln
    description: Sales Document Number
  - name: sales_document_item_posnr
    description: Sales Document Item Number
  - name: wbs_element_pspnr
    description: WBS Element
  - name: vendor_lifnr
    description: Vendor Account Number
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
