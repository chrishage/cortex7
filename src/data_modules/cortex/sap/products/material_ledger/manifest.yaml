displayName: SAP Material Ledger
description: This data product includes information about SAP material ledger from
  the Materials Management (MM), Controlling (CO) module in the Supply Chain, Finance
  domain in SAP S/4HANA or SAP ECC. This data product provides a unified interface
  for material valuation and costing data from SAP systems (supporting both ECC and
  S/4HANA). It abstracts the complexities of SAP's material ledger architecture, allowing
  easy consumption of material cost details, valuation history, and period-end totals.
category: source_aligned_product
type: material_ledger
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      ecc:
      - mbew
      - mbewh
      common:
      - ckmlhd
      - ckmlcr
      - t001k
      - t001
      - t001w
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
