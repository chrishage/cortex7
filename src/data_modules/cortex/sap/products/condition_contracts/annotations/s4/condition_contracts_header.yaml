description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Materials Management
  (MM) module in the Sales, Supply Chain domain and provides header-level SAP Condition Contract Settlement
  (CCS) definitions from WCOCOH (e.g., partner numbers, contract types, and validity dates) to track commercial
  rebate contracts. The data is captured at the granularity of Condition Contract Number, ensuring a unique
  audit trail for every record.
