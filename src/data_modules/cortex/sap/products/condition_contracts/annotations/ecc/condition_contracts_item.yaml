description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Materials Management
  (MM) module in the Sales, Supply Chain domain and provides line-item SAP Condition Contract Settlement
  rules from WCOCOI (e.g., eligibility criteria, materials, and settlement parameters) to define contract
  settlement conditions. The data is captured at the granularity of Condition Contract Number and Item
  Number Item, ensuring a unique audit trail for every record.
