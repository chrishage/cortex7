description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Materials Management
  (MM) module in the Sales, Supply Chain domain and provides scheduled settlement calendar dates and settlement
  document references from WB2_D_SETTL_CAL to monitor payout status and evaluation frequencies. The data
  is captured at the granularity of Client (System), Condition Contract, Settlement Date Settl, and Settlement
  Date Sequential Id Settl Date Seq, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: condition_contract_num
    description: Condition Contract, PK
  - name: settlement_date_settl_date
    description: Settlement Date, PK
  - name: settlement_date_sequential_id_settl_date_seq_id
    description: Settlement Date - Sequential Id, PK
  - name: settlement_date_type_settl_date_type
    description: Settlement Date Type
  - name: settlement_calendar_guid
    description: Settlement Calendar Guid
