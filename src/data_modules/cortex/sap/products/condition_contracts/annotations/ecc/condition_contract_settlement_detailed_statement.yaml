description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Materials Management
  (MM) module in the Sales, Supply Chain domain and provides a detailed settlement evaluation statement
  from WB2_D_BVDETAIL, reflecting business volume and settlement amounts, to support commercial rebate
  audits. The data is captured at the granularity of Client (System), Condition Contract, Document, Document
  Item, Document Type Business Volume Doc, Document Id Business Volume Doc, Document Id Business Volume
  2 Doc, Document Id Business Volume 3 Doc, and Document Item Business Volume Doc, ensuring a unique audit
  trail for every record.
