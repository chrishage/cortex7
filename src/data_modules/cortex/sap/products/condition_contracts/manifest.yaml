displayName: SAP Condition Contracts
description: This data product includes information about SAP condition contracts
  from the Sales and Distribution (SD), Materials Management (MM) module in the Sales,
  Supply Chain domain in SAP S/4HANA or SAP ECC. The Condition Contracts data product
  models SAP Condition Contract Settlement (CCS) master data, settlement calendars,
  business volume details, and detailed settlement statements across ECC and S/4HANA
  systems.
category: source_aligned_product
type: condition_contracts
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - wb2_d_bvdetail
      - wb2_d_settl_cal
      - wcocoh
      - wcocoi
    modulePath: cortex.sap.foundations.sap
builder: sap_product
