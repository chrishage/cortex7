description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides accounting document header metadata from SAP BKPF (e.g., posting dates, entry dates,
  user details, document status, and currency keys), enriched with calendar date dimensions for financial
  reporting. The data is captured at the granularity of Client (System), Company Code, Accounting Document
  Number, and Fiscal Year, ensuring a unique audit trail for every record.
