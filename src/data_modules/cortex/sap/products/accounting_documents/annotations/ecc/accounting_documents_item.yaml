description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides detailed accounting document line items from SAP BSEG (e.g., amounts, taxes, accounts,
  and order details) with dynamically adjusted currency decimal shifts, enriched with calendar date dimensions.
  The data is captured at the granularity of Client (System), Company Code, Accounting Document Number,
  Fiscal Year, and Line Item, ensuring a unique audit trail for every record.
