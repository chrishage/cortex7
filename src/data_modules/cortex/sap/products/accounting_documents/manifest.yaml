displayName: SAP Accounting Documents
description: This data product includes information about SAP accounting documents
  from the Financial Accounting (FI) module in the Finance domain in SAP S/4HANA or
  SAP ECC. The Accounting Documents data product provides clean, analytics-ready financial
  transaction models from SAP ERP accounting document headers and segments. It enables
  high-fidelity financial reporting, auditing, and general ledger line item analytics
  for enterprise finance teams.
category: source_aligned_product
type: accounting_documents
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - bkpf
      - bseg
      - tcurx
      s4:
      - t005
    modulePath: cortex.sap.foundations.sap
builder: sap_product
