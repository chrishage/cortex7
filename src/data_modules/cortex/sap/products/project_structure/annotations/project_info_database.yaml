description: This view is based on SAP S/4HANA or SAP ECC Project System (PS), Controlling (CO) module
  in the Finance, Supply Chain domain and provides actual, budget, commitment, and planning values by
  period and fiscal year for SAP projects and WBS elements from the Project Info Database (RPSCO). The
  data is captured at the granularity of Client (System), Object Number, Ledger, Value Type, Object Indicator,
  Fiscal Year, Value Category, Budget Type, Version, Category, Fund, Transaction Currency, and Period
  Block, ensuring a unique audit trail for every record.
