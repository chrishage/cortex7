description: This view is based on SAP S/4HANA or SAP ECC Project System (PS), Controlling (CO) module
  in the Finance, Supply Chain domain and provides Combines SAP Project Definitions, WBS Elements, and
  Scheduling Data from PROJ, PRPS, PRTE, and PRHI to provide a view of project structures, hierarchies,
  and timelines. The data is captured at the granularity of Client (System), Project Internal Id, and
  Wbs Element Internal Id, ensuring a unique audit trail for every record.
