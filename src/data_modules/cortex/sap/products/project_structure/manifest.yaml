displayName: SAP Project Structure
description: This data product includes information about SAP project structure from
  the Project System (PS), Controlling (CO) module in the Finance, Supply Chain domain
  in SAP S/4HANA or SAP ECC. The Project Structure data product combines project definitions,
  WBS (Work Breakdown Structure) elements, hierarchical structures, and scheduling
  data from SAP systems. It provides a comprehensive, unified view of project lifecycles,
  enabling tracking of project organization, status, schedules, and financial database
  values. This foundation supports long-term project planning, controlling, budget
  management, and operational milestone analytics.
category: source_aligned_product
type: project_structure
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - proj
      - prps
      - prte
      - prhi
      - rpsco
    modulePath: cortex.sap.foundations.sap
builder: sap_product
