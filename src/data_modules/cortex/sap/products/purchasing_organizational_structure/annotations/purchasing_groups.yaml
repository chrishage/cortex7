description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides Defines purchasing groups master data from SAP T024, mapping individual purchasing
  groups to their names, phone numbers, and emails. The data is captured at the granularity of Client
  (System) and Purchasing Group, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: purchasing_group_ekgrp
    description: Purchasing Group, PK
  - name: purchasing_group_name_eknam
    description: Description of Purchasing Group
  - name: purchasing_group_telephone_ektel
    description: Telephone Number of Purchasing Group
  - name: email_address_smtp_addr
    description: E-Mail Address
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
