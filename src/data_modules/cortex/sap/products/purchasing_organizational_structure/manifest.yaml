displayName: SAP Purchasing Organizational Structure
description: This data product includes information about SAP purchasing organizational
  structure from the Materials Management (MM) module in the Supply Chain domain in
  SAP S/4HANA or SAP ECC. Outlines the structural assignments of purchasing organizations
  and buying groups across enterprise facilities. It enables centralized procurement
  compliance tracking, strategic vendor negotiation analyses, and spending governance.
category: source_aligned_product
type: purchasing_organizational_structure
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - t024e
      - t024
    modulePath: cortex.sap.foundations.sap
builder: sap_product
