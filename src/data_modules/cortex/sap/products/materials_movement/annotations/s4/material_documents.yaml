description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides SAP operational goods movements, tracking receipts, issues, plant-to-plant
  transfers, and inventory adjustments from transactional logs MSEG and MATDOC. The data is captured at
  the granularity of Client (System), Material Document Year, Material Document Number, and Material Document
  Item, ensuring a unique audit trail for every record.
