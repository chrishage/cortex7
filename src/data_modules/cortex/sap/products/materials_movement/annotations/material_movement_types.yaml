description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides a system-wide dictionary of SAP material movement type keys from T156 enriched
  with multilingual description texts from T156T. The data is captured at the granularity of Client (System),
  Language Key, and Material Movement Type, ensuring a unique audit trail for every record.
