description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM), Sales and Distribution
  (SD) module in the Cross-Functional domain and provides a standardized, globally consistent view of
  SAP units of measurement (weights, volumes, dimensions, temperatures) from T006, T006A, and T006T, mapped
  to ISO codes. The data is captured at the granularity of Client (System), Unit Of Measurement, and Language
  Key, ensuring a unique audit trail for every record.
