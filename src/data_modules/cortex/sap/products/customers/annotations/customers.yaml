description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Financial Accounting
  (FI) module in the Sales, Finance domain and provides a single, comprehensive, and consistent view of
  customer master records across the business. By integrating core details (such as customer identifiers,
  group attributes, and account controls) with standardized address data, it enables customer relationship
  management, master data auditing, localized sales execution, and geo-analytics. The data is captured
  at the granularity of Client (System), Customer Number, Address, Valid From Date Date, and Version Id
  For International Addresses Nation, ensuring a unique audit trail for every record.
