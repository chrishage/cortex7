displayName: SAP Customers
description: This data product includes information about SAP customers from the Sales
  and Distribution (SD), Financial Accounting (FI) module in the Sales, Finance domain
  in SAP S/4HANA or SAP ECC. It offers an authoritative, 360-degree profile of customer
  master data, integrating core attributes, organizational assignments, and partner
  functions. It acts as a cornerstone for customer relationship management, localized
  marketing analytics, and AI-ready churn prediction models.
category: source_aligned_product
type: customers
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - kna1
      - adrc
    modulePath: cortex.sap.foundations.sap
builder: sap_product
