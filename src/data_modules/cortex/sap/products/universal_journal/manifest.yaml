displayName: SAP Universal Journal
description: This data product includes information about SAP universal journal from
  the Financial Accounting (FI), Controlling (CO) module in the Finance domain in
  SAP S/4HANA. It exposes the unified, high-fidelity financial ledger for
  balance sheet and P&L reporting. It constitutes the definitive source of truth for
  corporate fiscal consolidation, cost center controlling, and AI-driven variance
  analyses.
category: source_aligned_product
type: universal_journal
dependencies:
  sapModule:
    supportedVersions:
    - s4
    tables:
      s4:
      - acdoca
      - acdocu
      - finsc_ledger
      - finsc_ledger_t
      - tf200
      - tf201
      - fincs_ref_vers_r
      common:
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
