description: This view is based on SAP S/4HANA Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides group-level consolidation journal entries from S/4HANA's ACDOCU
  table, supporting corporate financial consolidation reporting. The data is captured at the granularity
  of Client (System), Ledger, Dimension Rdimen, Fiscal Year, Document Number, and Line Item, ensuring
  a unique audit trail for every record.
