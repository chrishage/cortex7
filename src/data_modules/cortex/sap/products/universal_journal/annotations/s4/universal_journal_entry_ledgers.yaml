description: This view is based on SAP S/4HANA Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides a master list of ledgers defined in S/4HANA from FINSC_LEDGER,
  enriched with multi-lingual text descriptions from FINSC_LEDGER_T. The data is captured at the granularity
  of Client (System), Ledger, and Language, ensuring a unique audit trail for every record.
