  - name: client_mandt
    description: Client (Mandant), PK
  - name: ledger_rldnr
    description: Ledger, PK
  - name: language_langu
    description: Language, PK
  - name: ledger_name_name
    description: Ledger Name
  - name: ledger_type_ledger_type
    description: Ledger Type
  - name: extension_ledger_type_ext_ledger_type
