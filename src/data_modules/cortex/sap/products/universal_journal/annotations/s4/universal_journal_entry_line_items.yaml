description: This view is based on SAP S/4HANA Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides complete journal entry details from S/4HANA's unified finance
  ledger (ACDOCA), supporting balance sheet, P&L, and variance analysis reporting. The data is captured
  at the granularity of Client (System), Ledger, Company Code, Fiscal Year, Accounting Document Number,
  and Ledger G L Line Item, ensuring a unique audit trail for every record.
