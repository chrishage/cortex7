ecc:
  vendors:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: supply_chain
    - key: sap_module
      value: sap_mm
    - key: data_class
      value: masterdata
    dataformTags: [sap, finance, sap_mm, sap_fi, source_aligned_product, 
        masterdata, daily]
    clusterDetails:
      columns: [country_key_land1, vendor_account_group_ktokk]
    partitionDetails:
      column: date_on_which_the_record_was_created_erdat
      partitionType: DATE
      timeGrain: MONTH
