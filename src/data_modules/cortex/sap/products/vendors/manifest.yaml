displayName: SAP Vendors
description: This data product includes information about SAP vendors from the Materials
  Management (MM), Financial Accounting (FI) module in the Supply Chain, Finance domain
  in SAP S/4HANA or SAP ECC. It profiles the centralized vendor master catalog, integrating
  operational identifiers, organizational extensions, and bank accounting frameworks.
  Essential for SRM (Supplier Relationship Management), vendor risk modeling, and
  strategic sourcing.
category: source_aligned_product
type: vendors
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - lfa1
      - adrc
    modulePath: cortex.sap.foundations.sap
builder: sap_product
