description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM), Financial Accounting
  (FI) module in the Supply Chain, Finance domain and provides a comprehensive view of vendor master records
  by merging base supplier information (LFA1) with detailed physical address details (ADRC). The data
  is captured at the granularity of Client (System), Account Number Of Vendor Or Creditor, Address, Valid
  From Date Date, and Version Id For International Addresses Nation, ensuring a unique audit trail for
  every record.
