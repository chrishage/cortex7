displayName: SAP Agency Settlement Documents
description: This data product includes information about SAP agency settlement documents
  from the Sales and Distribution (SD), Materials Management (MM) module in the Sales,
  Supply Chain domain in SAP S/4HANA or SAP ECC. The Agency Settlement Documents data
  product provides analytics-ready models for agency business and settlement document
  headers and items from SAP ERP (WBRK/WBRP). It supports sales rebate tracking, commission
  settlement analytics, and third-party purchasing/sales flow reporting.
category: source_aligned_product
type: agency_settlement_documents
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - wbrk
      - wbrp
    modulePath: cortex.sap.foundations.sap
builder: sap_product
