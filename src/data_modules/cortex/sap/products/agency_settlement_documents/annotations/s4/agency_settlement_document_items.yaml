description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Materials Management
  (MM) module in the Sales, Supply Chain domain and provides line-item agency business and settlement
  document details from SAP WBRP (e.g., material numbers, quantities, pricing conditions, and net values)
  to support financial reconciliation and third-party purchase/sales flow reporting. The data is captured
  at the granularity of Client (System), Agency Document Number, and Item Number Mposnr, ensuring a unique
  audit trail for every record.
