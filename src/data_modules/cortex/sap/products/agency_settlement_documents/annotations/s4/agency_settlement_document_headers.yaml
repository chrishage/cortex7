description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Materials Management
  (MM) module in the Sales, Supply Chain domain and provides header-level agency business and settlement
  document metadata from SAP WBRK (e.g., partner details, posting status, and currency keys) to support
  rebate tracking and commission settlement analytics. The data is captured at the granularity of Client
  (System) and Agency Document Number, ensuring a unique audit trail for every record.
