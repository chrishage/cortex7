ecc:
  sales_document_headers:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, source_aligned_product, transactional, 
        hourly]
  sales_document_items:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, source_aligned_product, transactional, 
        hourly]
  sales_document_schedule_lines:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, source_aligned_product, transactional, 
        hourly]
  sales_document_partners:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, source_aligned_product, transactional, 
        hourly]
  sales_document_header_statuses:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, source_aligned_product, transactional, 
        hourly]
  sales_document_item_statuses:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, source_aligned_product, transactional, 
        hourly]
  sales_document_flow:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, source_aligned_product, transactional, 
        hourly]
    filters:
      preceding_document_categories: ['C']
      delivery_document_categories: ['J', 'T']
      billing_document_categories: ['M']
