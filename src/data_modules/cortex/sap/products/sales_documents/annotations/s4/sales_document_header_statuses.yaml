description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides processing, delivery, and billing statuses of sales document headers from SAP VBUK
  (ECC) or VBAK (S4). The data is captured at the granularity of Client (System) and Sales Document, ensuring
  a unique audit trail for every record.
