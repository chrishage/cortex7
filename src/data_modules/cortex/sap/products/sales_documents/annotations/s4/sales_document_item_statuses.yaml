description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides processing, delivery, and billing statuses of individual sales document items from
  SAP VBUP (ECC) or VBAP (S4). The data is captured at the granularity of Client (System), Sales
  Document, and Sales Document Item, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: sales_document_vbeln
    description: Sales Document Number, PK, PK
  - name: sales_document_item_posnr
    description: Sales Document Item Number, PK, PK
  - name: reference_status_rfsta
    description: Reference Status
  - name: overall_status_of_reference_rfgsa
    description: Overall Status of Reference
  - name: confirmation_status_of_document_item_besta
    description: Confirmation Status of Document Item
  - name: delivery_status_lfsta
    description: Delivery Status
  - name: overall_delivery_status_of_the_item_lfgsa
    description: Overall Delivery Status of the Item
  - name: goods_movement_status_wbsta
    description: Goods Movement Status
  - name: billing_status_for_order_fksaa
    description: Billing Status for Order
  - name: rejection_status_for_sd_item_absta
    description: Rejection Status for SD Item
  - name: overall_processing_status_of_the_sd_document_item_gbsta
    description: Overall Processing Status of SD Item
  - name: general_incompletion_status_of_item_uvall
    description: General Incompletion Status of Item
  - name: incompletion_status_of_the_item_with_regard_to_delivery_uvvlk
    description: Incompletion Status of Item with Regard to Delivery
  - name: item_incompletion_status_with_respect_to_billing_uvfak
    description: Item Incompletion Status with Respect to Billing
  - name: pricing_for_item_is_incomplete_uvprs
    description: Pricing for Item Is Incomplete
  - name: customer_reserves1_item_status_uvp01
    description: Customer Reserves 1 Item Status
  - name: customer_reserves2_item_status_uvp02
    description: Customer Reserves 2 Item Status
