description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides sales document header-level details from SAP VBAK, tracking customer accounts, net
  value, document categories, and dates. The data is captured at the granularity of Client (System) and
  Document Number, ensuring a unique audit trail for every record.
