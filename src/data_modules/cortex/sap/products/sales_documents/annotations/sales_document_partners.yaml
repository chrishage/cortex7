description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides partner details for sales documents at both header and item levels from SAP VBPA,
  mapping roles like Sold-to Party and Ship-to Party. The data is captured at the granularity of Client
  (System), Sales Document, Sales Document Item, and Partner Function, ensuring a unique audit trail for
  every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: sales_document_vbeln
    description: Sales Document Number, PK, PK
  - name: sales_document_item_posnr
    description: Sales Document Item Number, PK, PK
  - name: partner_function_parvw
    description: Partner Function (E.G Sold-To, Ship-To), PK, PK
  - name: customer_number_kunnr
    description: Customer Number
  - name: vendor_number_lifnr
    description: Vendor Number
  - name: personnel_number_pernr
    description: Personnel Number
