description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides schedule line data for sales items from SAP VBEP, detailing confirmed, ordered,
  and delivered quantities. The data is captured at the granularity of Client (System), Sales Document,
  Sales Document Item, and Schedule Line Number, ensuring a unique audit trail for every record.
