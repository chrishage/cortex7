description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides picking, delivery, and billing statuses of individual sales document items from
  SAP VBUP (ECC) or VBAP/LIPS (S4). The data is captured at the granularity of Client (System), Sales
  Document, and Sales Document Item, ensuring a unique audit trail for every record.
fields:
