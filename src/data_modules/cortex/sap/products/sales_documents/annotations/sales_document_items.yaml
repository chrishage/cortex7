description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides sales document item-level transaction details from SAP VBAP, documenting materials,
  quantities ordered, net prices, and plant locations. The data is captured at the granularity of Client
  (System), Document Number, and Item Number, ensuring a unique audit trail for every record.
