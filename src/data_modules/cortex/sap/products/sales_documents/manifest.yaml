displayName: SAP Sales Documents
description: This data product includes information about SAP sales documents from
  the Sales and Distribution (SD) module in the Sales domain in SAP S/4HANA or SAP
  ECC. It integrates end-to-end sales transactions, aggregating orders, schedule lines,
  statuses, and subsequent document flows. Serves as the bedrock for sales velocity
  forecasting, demand planning, and customer fulfillment analytics.
category: source_aligned_product
type: sales_documents
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - vbak
      - vbap
      - vbep
      - vbpa
      - tcurx
      - vbfa
      ecc:
      - vbuk
      - vbup
    modulePath: cortex.sap.foundations.sap
builder: sap_product
