displayName: SAP Accounts Payable
description: This data product includes information about SAP accounts payable from
  the Financial Accounting (FI) module in the Finance domain in SAP S/4HANA or SAP
  ECC. It provides a unified view of accounts payable across legacy open items, cleared
  transactions, and universal ledger journal entries. It covers core financial domains
  including vendor ledger accounting, payment terms optimization, and liability tracking,
  supporting enterprise cash-flow analytics and automated reconciliation pipelines.
category: source_aligned_product
type: accounts_payable
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      ecc:
      - bsik
      - bsak
      s4:
      - acdoca
      - bseg
      common:
      - bkpf
    modulePath: cortex.sap.foundations.sap
builder: sap_product
