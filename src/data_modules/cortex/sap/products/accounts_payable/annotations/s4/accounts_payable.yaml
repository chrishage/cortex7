description: This view is based on SAP S/4HANA Financial Accounting (FI) module in the Finance
  domain and provides a unified view of accounts payable from the SAP S/4HANA universal ledger journal
  entries (ACDOCA, BKPF, BSEG), filtered by Vendor account type to support cash-flow analytics and liability
  tracking. The data is captured at the granularity of Client (System), Company Code, Accounting Document
  Number, Fiscal Year, and Ledger G L Line Item, ensuring a unique audit trail for every record.
