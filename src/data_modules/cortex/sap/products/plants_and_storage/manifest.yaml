displayName: SAP Plants and Storage
description: This data product includes information about SAP plants and storage from
  the Materials Management (MM) module in the Supply Chain domain in SAP S/4HANA or
  SAP ECC. Defines the hierarchical structural mapping of enterprise plants, storage
  locations, and storage bins. It underpins granular warehouse layout analysis, stock
  placement logic, and logistical capacity planning.
category: source_aligned_product
type: plants_and_storage
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - t001w
      - t001l
    modulePath: cortex.sap.foundations.sap
builder: sap_product
