description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides plant master data from SAP T001W mapping individual plant units to addresses,
  organizational assignments, and operational parameters. The data is captured at the granularity of Client
  (System) and Plant, ensuring a unique audit trail for every record.
