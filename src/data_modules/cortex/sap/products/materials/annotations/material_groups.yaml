description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides a catalog of material group classifications from SAP T023 and T023T, grouping
  materials for inventory valuation, purchasing controls, and structured sales analysis. The data is captured
  at the granularity of Client (System), Material Group, and Language Key, ensuring a unique audit trail
  for every record.
