description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides material inventory levels, multilingual material descriptions, plant names,
  and storage location names at the storage location level from SAP MARD, MAKT, T001W, and T001L. The
  data is captured at the granularity of Client (System), Material Number, Language Key, Plant, and Storage
  Location, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: material_number_matnr
    description: Material Number, PK
  - name: language_key_spras
    description: Language Key, PK
  - name: material_text_maktx
    description: Material Description
  - name: plant_werks
    description: Plant, PK
  - name: plant_name_name1
    description: Plant Name
  - name: storage_location_lgort
    description: Storage Location, PK
  - name: storage_location_text_lgobe
