description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides Maps material type codes to localized descriptions from SAP T134 and T134T,
  defining control parameters such as price controls and procurement types. The data is captured at the
  granularity of Client (System), Language Key, and Material Type, ensuring a unique audit trail for every
  record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: language_key_spras
    description: Language Key, PK
  - name: material_type_mtart
    description: Material Type, PK
  - name: reference_material_type_mtref
    description: Reference Material Type
  - name: screen_reference_mbref
    description: Screen Reference Depending on the Material Type
  - name: description_mtbez
    description: Material Type Description
  - name: display_material_aranz
    description: Display Material on Cash Register Display
  - name: time_till_deleted_ardel
    description: Time in Days Until a Material Is Deleted
  - name: authorization_group_begru
    description: Authorization Group in the Material Master
  - name: external_purchase_orders_bsext
    description: External Purchase Orders Allowed
  - name: internal_purchase_orders_bsint
    description: Internal Purchase Orders Allowed
  - name: history_requirement_cchis
    description: 'Control (Time) of History Requirement: Material'
  - name: create_new_batch_chneu
