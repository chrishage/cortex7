description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides plant-specific material data from SAP MARC, tracking deletion flags, batch
  management indicators, plant-specific statuses, and safety stock levels. The data is captured at the
  granularity of Client (System), Material Number, and Plant, ensuring a unique audit trail for every
  record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: material_number_matnr
    description: Material Number, PK
  - name: language_key_spras
    description: Language Key, PK
  - name: material_text_maktx
    description: Material Description
  - name: plant_werks
    description: Plant, PK
  - name: plant_name_name1
    description: Plant Name
  - name: maintenance_status_pstat
    description: Maintenance Status
  - name: flag_material_for_deletion_at_plant_level_lvorm
    description: Flag Material for Deletion At Plant Level
  - name: valuation_category_bwtty
    description: Valuation Category
  - name: batch_management_indicator_xchar
    description: Batch Management Indicator
  - name: plant_specific_material_status_mmsta
    description: Plant-Specific Material Status
  - name: date_from_which_the_plant_specific_material_status_is_valid_mmstd
    description: Date From Which the Plant-Specific Material Status Is Valid
  - name: safety_stock_eisbe
    description: Safety Stock
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
