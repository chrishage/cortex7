description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides SAP general material master data from MARA combined with multilingual text
  entries from MAKT, documenting product codes, descriptions, and physical and dimensional specifications.
  The data is captured at the granularity of Client (System), Material Number, and Language Key, ensuring
  a unique audit trail for every record.
