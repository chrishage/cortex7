description: This view is based on SAP S/4HANA Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides Nodes of the financial hierarchies. Joined view of `hrrp_node`
  and `hrrp_nodet`. The data is captured at the granularity of system default keys, ensuring a unique
  audit trail for every record.
