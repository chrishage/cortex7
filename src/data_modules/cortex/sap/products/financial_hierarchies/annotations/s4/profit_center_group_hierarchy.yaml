description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides Master data / hierarchy for Profit Center Groups. In S/4HANA,
  this is the HANA-optimized hierarchy. In ECC, it is the master data (texts) for profit center sets.
  The data is captured at the granularity of system default keys, ensuring a unique audit trail for every
  record.
fields:
