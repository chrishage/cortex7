description: This view is based on SAP S/4HANA Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides Directory of financial hierarchies. Base view of `hrrp_directory`.
  The data is captured at the granularity of system default keys, ensuring a unique audit trail for every
  record.
