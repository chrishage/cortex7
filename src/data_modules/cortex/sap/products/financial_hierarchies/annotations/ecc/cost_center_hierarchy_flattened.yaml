description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides Flattened cost center hierarchy mapping each cost center to
  all its ancestor nodes with texts. The data is captured at the granularity of system default keys, ensuring
  a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: hierarchy_class_setclass
    description: Hierarchy Class (Set Class), PK
  - name: hierarchy_subclass_subclass
    description: Hierarchy Subclass (Controlling Area), PK
  - name: hierarchy_type_hierbase
    description: Hierarchy Name (Root Set), PK
  - name: language_key_spras
    description: Language Key, PK
  - name: cost_center_kostl
    description: Cost Center, PK
  - name: cost_center_node
    description: Cost Center Node, PK
  - name: parent_node
    description: Parent Node, PK
  - name: parent_node_text
    description: Parent Node Text
  - name: cost_center_node_text
    description: Cost Center Node Text
  - name: level
    description: Level in Hierarchy
  - name: is_leaf_node
    description: Is Leaf Node Flag
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
