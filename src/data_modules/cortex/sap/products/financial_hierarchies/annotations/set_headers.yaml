description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides Joined view of `setheader` and `setheadert` containing set
  headers and descriptions. The data is captured at the granularity of system default keys, ensuring a
  unique audit trail for every record.
fields:
