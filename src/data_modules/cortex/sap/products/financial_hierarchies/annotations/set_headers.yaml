    description: Client (Mandant), PK
  - name: set_class_setclass
    description: Set Class, PK
  - name: subclass_subclass
    description: Organizational Unit, PK
  - name: set_name_setname
    description: Set Name, PK
  - name: language_key_langu
    description: Language Key, PK
  - name: set_type_settype
    description: Set Type
  - name: table_name_tabname
    description: Table Name
  - name: field_name_fieldname
    description: Field Name
  - name: created_on_credate
    description: Creation Date
  - name: created_at_cretime
    description: Creation Time
  - name: created_by_creuser
    description: Created by
  - name: changed_on_upddate
    description: Last Changed on
  - name: changed_at_updtime
    description: Last Changed Time
  - name: changed_by_upduser
    description: Last Changed by
  - name: set_title_descript
    description: Description
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
