description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Controlling (CO)
  module in the Finance domain and provides Base view of `setnode` containing lower-level sets in sets.
  The data is captured at the granularity of system default keys, ensuring a unique audit trail for every
  record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: set_class_setclass
    description: Set Class, PK
  - name: subclass_subclass
    description: Organizational Unit, PK
  - name: set_name_setname
    description: Set Name, PK
  - name: line_id_lineid
    description: Set Line, PK
  - name: subset_class_subsetcls
    description: Subset Class
  - name: subset_subclass_subsetscls
    description: Subset Subclass
  - name: subset_name_subsetname
    description: Subset Name
  - name: sequence_number_seqnr
    description: Sequence Number
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
