description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides cost center, profit center, plant, and other time-varying organizational allocations
  for fixed assets from SAP ANLZ. The data is captured at the granularity of Client (System), Company
  Code, Asset Number, Asset Subnumber, and Valid To, ensuring a unique audit trail for every record.
