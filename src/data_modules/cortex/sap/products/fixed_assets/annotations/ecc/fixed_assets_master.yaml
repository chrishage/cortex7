description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides SAP fixed asset master data from ANLA, ANLH, and ANKT, combining core asset details,
  main asset numbers, and class descriptions to enable lifecycle and ownership reporting. The data is
  captured at the granularity of Client (System), Company Code, Asset Number, Asset Subnumber, and Language
  Key, ensuring a unique audit trail for every record.
