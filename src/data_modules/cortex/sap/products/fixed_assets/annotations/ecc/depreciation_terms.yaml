description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides depreciation parameters and useful life settings from ANLB, T093B, and related SAP
  tables to model fixed asset valuation trends. The data is captured at the granularity of Client (System),
  Company Code, Asset Number, Asset Subnumber, Depreciation Area, Valid To, and Language Key, ensuring
  a unique audit trail for every record.
