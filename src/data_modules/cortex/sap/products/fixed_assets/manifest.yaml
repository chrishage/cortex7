displayName: SAP Fixed Assets
description: This data product includes information about SAP fixed assets from the
  Financial Accounting (FI) module in the Finance domain in SAP S/4HANA or SAP ECC.
  It unifies asset master records, hierarchical assignments, and lifecycle details
  across the enterprise. It supports compliance auditing, CAPEX (Capital Expenditure)
  tracking, and strategic asset depreciation modeling.
category: source_aligned_product
type: fixed_assets
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - anla
      - anlh
      - ankt
      - anlb
      - t093b
      - t093t
      - t090nat
      - t093c
      - anlz
      - t095t
      - t098t
    modulePath: cortex.sap.foundations.sap
builder: sap_product
