description: This view is based on SAP S/4HANA or SAP ECC Production Planning (PP) module in the Manufacturing
  domain and provides Item-level material numbers, plants, batch assignments, and goods receipt values
  The data is captured at the granularity of Client (System), Order Number, and Order Item Number, ensuring
  a unique audit trail for every record.
