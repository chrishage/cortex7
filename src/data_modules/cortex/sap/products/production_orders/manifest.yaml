displayName: SAP Production Orders
description: This data product includes information about SAP production orders from
  the Production Planning (PP) module in the Manufacturing domain in SAP S/4HANA or
  SAP ECC. The Production Orders data product provides structured analytical datasets
  for manufacturing order management. It exposes conformed header details and item-level
  transactions, facilitating operational reporting, capacity planning, cost estimation,
  and stock movement analysis across both SAP ECC and S/4HANA systems.
category: source_aligned_product
type: production_orders
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - aufk
      - afko
      - afpo
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
