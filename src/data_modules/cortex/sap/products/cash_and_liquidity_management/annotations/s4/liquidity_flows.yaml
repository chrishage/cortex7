description: This view is based on SAP S/4HANA Financial Accounting (FI), Financial Supply
  Chain Management (FSCM) module in the Finance domain and provides granular, real-time liquidity flows
  from the S/4HANA One Exposure from Operations (FQM_FLOW) table. The data is captured at the granularity
  of system default keys, ensuring a unique audit trail for every record.
