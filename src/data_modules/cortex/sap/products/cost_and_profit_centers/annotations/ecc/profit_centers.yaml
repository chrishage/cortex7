description: This view is based on SAP S/4HANA or SAP ECC Controlling (CO) module in the Finance domain
  and provides profit center master definitions from CEPC and CEPCT, including valid date ranges, company
  codes, segments, responsible persons, lock indicators, and multi-lingual names/descriptions, to enable
  profit center performance evaluation and segment reporting. The data is captured at the granularity
  of Client (System), Controlling Area, Profit Center, Valid To, and Language Key, ensuring a unique audit
  trail for every record.
