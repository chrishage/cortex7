description: This view is based on SAP S/4HANA or SAP ECC Controlling (CO) module in the Finance domain
  and provides cost center master definitions from CSKS and CSKT, including valid date ranges, company
  codes, departments, responsible persons, lock indicators, and multi-lingual names/descriptions, to support
  corporate spend tracking. The data is captured at the granularity of Client (System), Controlling Area,
  Cost Center, Valid To, and Language Key, ensuring a unique audit trail for every record.
