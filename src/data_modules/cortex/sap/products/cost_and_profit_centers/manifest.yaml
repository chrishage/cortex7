displayName: SAP Cost and Profit Centers
description: This data product includes information about SAP cost and profit centers
  from the Controlling (CO) module in the Finance domain in SAP S/4HANA or SAP ECC.
  It standardizes and exposes SAP cost centers and profit centers, complete with standard
  hierarchies and texts. This enables organizational spend mapping, profitability
  analysis, and responsibility accounting.
category: source_aligned_product
type: cost_and_profit_centers
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - cepc
      - cepct
      - csks
      - cskt
    modulePath: cortex.sap.foundations.sap
builder: sap_product
