description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides sales organization details and configurations from SAP TVKO, enriched with multi-lingual
  description texts from TVKOT to support sales territory structure analysis. The data is captured at
  the granularity of Client (System), Sales Organization, and Language Key, ensuring a unique audit trail
  for every record.
