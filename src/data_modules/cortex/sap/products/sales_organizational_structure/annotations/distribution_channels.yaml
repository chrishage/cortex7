description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides a master dictionary of distribution channels from SAP TVTW, enriched with multi-lingual
  names from TVTWT. The data is captured at the granularity of Client (System), Distribution Channel,
  and Language Key, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: distribution_channel_vtweg
    description: Distribution Channel, PK
  - name: language_key_spras
    description: Language Key, PK
  - name: name_vtext
    description: Name
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
