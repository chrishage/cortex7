displayName: SAP Sales Organizational Structure
description: This data product includes information about SAP sales organizational
  structure from the Sales and Distribution (SD) module in the Sales domain in SAP
  S/4HANA or SAP ECC. It structures sales organizations, distribution channels, and
  divisions alongside their corresponding facility assignments. Supports sales territory
  performance analyses, multi-channel revenue distribution tracking, and sales operations
  planning.
category: source_aligned_product
type: sales_organizational_structure
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - tvko
      - tvkot
      - tvtw
      - tvtwt
      - tspa
      - tspat
    modulePath: cortex.sap.foundations.sap
builder: sap_product
