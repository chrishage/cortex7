description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides master definitions of SAP Fiscal Year Variants from T009, including calendar year
  markers, year-dependent indicators, and the number of posting and special periods. The data is captured
  at the granularity of Client (System) and Fiscal Year Variant, ensuring a unique audit trail for every
  record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: fiscal_year_variant_periv
    description: Fiscal Year Variant, PK
  - name: calendar_year_xkale
    description: Calendar Year
  - name: year_dependent_xjabh
    description: Year-Dependent
  - name: number_of_posting_periods_anzbp
    description: Numberposting Periods
  - name: number_of_special_periods_anzsp
    description: Numberspecial Periods
  - name: fiscal_weeks_from_fy_start_xweek
    description: Fiscal Weeks From Fy Start
  - name: offset_before_fiscal_year_fyofb
    description: Offset Before Fiscal Year
  - name: offset_after_fiscal_year_fyofe
    description: Offset After Fiscal Year
  - name: weekly_calendar_xweekquart
    description: Weekly Calendar
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
