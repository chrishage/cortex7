description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides period definitions from SAP T009B, mapping calendar months and days to corporate
  fiscal posting periods and periods shifts. The data is captured at the granularity of Client (System),
  Fiscal Year Variant, Calendar Month Vmonat, and Calendar Day, ensuring a unique audit trail for every
  record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: fiscal_year_variant_periv
    description: Fiscal Year Variant, PK
  - name: year_bdatj
    description: Year, PK
  - name: calendar_month_bumon
    description: Calendar Month, PK
  - name: calendar_day_butag
    description: Calendar Day, PK
  - name: posting_period_poper
    description: Posting Period
  - name: year_shift_reljr
    description: Year Shift
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
