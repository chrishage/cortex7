displayName: SAP Fiscal Year Variants
description: This data product includes information about SAP fiscal year variants
  from the Financial Accounting (FI) module in the Finance domain in SAP S/4HANA or
  SAP ECC. The Fiscal Year Variants data product provides clean financial calendar
  modeling assets for SAP Fiscal Year Variants (`T009`) and their associated period
  definitions (`T009B`) across ECC and S/4HANA systems.
category: source_aligned_product
type: fiscal_year_variants
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - t009
      - t009b
    modulePath: cortex.sap.foundations.sap
builder: sap_product
