displayName: SAP Budget Allocations
description: This data product includes information about SAP budget allocations from the Financial Accounting
  (FI), Project System (PS), Controlling (CO) module in the Finance domain in SAP
  S/4HANA or SAP ECC. The Budget Allocations data product provides comprehensive visibility
  into SAP budget structures, including annual and overall budget allocations, balances,
  and individual budget posting documents.
category: source_aligned_product
type: budget_allocations
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - bpja
      - bpge
      - bpvg
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
