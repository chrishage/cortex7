description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Project System (PS),
  Controlling (CO) module in the Finance domain and provides Budget allocation document line items representing
  budget postings. The data is captured at the granularity of Client, Document Number, and Posting, ensuring
  a unique audit trail for every record.
