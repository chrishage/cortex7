description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Project System (PS),
  Controlling (CO) module in the Finance domain and provides Annual and overall budget allocations and
  balances per budget object. The data is captured at the granularity of Client, Ledger, Object Number,
  Commitment, Object Indicator, Value, Fiscal, Fund, Version, Budget, Transaction Currency, Budget Subtype,
  Year Of Cash Effectivity, and Functional, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: ledger_lednr
    description: Ledger, PK
  - name: object_number_objnr
    description: Object Number, PK
  - name: commitment_item_posit
    description: Internal Commitment Item (8), PK
  - name: object_indicator_trgkz
    description: Object Indicator, PK
  - name: value_type_wrttp
    description: Value Type, PK
  - name: fiscal_year_gjahr
    description: Fiscal Year, PK
  - name: fund_geber
    description: Fund, PK
  - name: version_versn
    description: Version, PK
  - name: budget_type_vorga
    description: Budget Type, PK
  - name: transaction_currency_twaer
    description: Transaction Currency, PK
  - name: budget_subtype_subvo
    description: Budget Subtype, PK
  - name: year_of_cash_effectivity_gnjhr
    description: Year of Cash Effectivity, PK
  - name: functional_area_farea
    description: Functional Area, PK
  - name: annual_value_transaction_currency_wtjhr
