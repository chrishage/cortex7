displayName: SAP Order Master Data
description: This data product includes information about SAP order master data from
  the Production Planning (PP), Controlling (CO) module in the Manufacturing, Finance
  domain in SAP S/4HANA or SAP ECC. The Order Master Data data product provides structured
  analytical datasets for order-level master data records in SAP systems. It exposes
  conformed master data details, facilitating operational reporting and tracking order
  attributes across SAP ECC and S/4HANA systems.
category: source_aligned_product
type: order_master_data
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - aufk
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
