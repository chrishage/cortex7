description: This view is based on SAP S/4HANA or SAP ECC Production Planning (PP), Controlling (CO) module
  in the Manufacturing, Finance domain and provides Enriched master records for all SAP system orders
  The data is captured at the granularity of Client (System) and Order Number, ensuring a unique audit
  trail for every record.
