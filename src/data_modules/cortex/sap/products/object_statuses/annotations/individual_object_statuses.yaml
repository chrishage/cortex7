description: This view is based on SAP S/4HANA or SAP ECC Production Planning (PP), Controlling (CO),
  Project System (PS) module in the Manufacturing, Finance, Supply Chain domain and provides Individual
  status details for SAP objects. The data is captured at the granularity of Client (System), Object Number,
  and Status, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: object_number_objnr
    description: Object Number, PK
  - name: status_stat
    description: Status, PK
  - name: status_inactive_inact
    description: Status Inactive Flag
  - name: change_number_chgnr
    description: Change Number
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
