description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides Maps and assigns Financial Statement Items to General Ledger (G/L) accounts from
  SAP FAGL_011ZC, verifying chart of accounts assignments and reporting node structures. The data is captured
  at the granularity of Client (System), Financial Statement Version, Financial Statement Item, Chart
  Of Accounts, and Gl Account From, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: financial_statement_version_versn
    description: Fs Version, PK
  - name: financial_statement_item_ergsl
    description: Financial Statement Item, PK
  - name: chart_of_accounts_ktopl
    description: Chart of Accounts, PK
  - name: gl_account_from_vonkt
    description: Account From, PK
  - name: gl_account_to_biskt
    description: Account to
  - name: debit_balance_indicator_xsoll
    description: Debit Indicator (D)
  - name: credit_balance_indicator_xhabn
    description: Credit Indicator (C)
  - name: group_balance_indicator_xverd
    description: Group Balance
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
