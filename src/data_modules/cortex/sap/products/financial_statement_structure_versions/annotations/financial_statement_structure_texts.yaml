description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides language-dependent text descriptions for Financial Statement Items from SAP FAGL_011QT
  to support financial reporting hierarchies. The data is captured at the granularity of Client (System),
  Financial Statement Version, Language Key, Financial Statement Item, Text Type, and Line Number, ensuring
  a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: financial_statement_version_versn
    description: Fs Version, PK
  - name: language_key_spras
    description: Language Key, PK
  - name: financial_statement_item_ergsl
    description: Financial Statement Item, PK
  - name: text_type_txtyp
    description: Text Type, PK
  - name: line_number_zeile
    description: Line, PK
  - name: financial_statement_item_text_txt45
    description: Text
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
