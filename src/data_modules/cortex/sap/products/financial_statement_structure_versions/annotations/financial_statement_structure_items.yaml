description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides hierarchical node items and structure layouts for Financial Statement Versions from
  SAP FAGL_011PC to automate balance sheet and P&L hierarchy generation. The data is captured at the granularity
  of Client (System), Financial Statement Version, and Node Id, ensuring a unique audit trail for every
  record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: financial_statement_version_versn
    description: Fs Version, PK
  - name: node_id_id
    description: Node Id, PK
  - name: node_type_type
    description: Type
  - name: financial_statement_item_ergsl
    description: Financial Statement Item
  - name: parent_node_id_parent
    description: Parent Node Id
  - name: child_node_id_child
    description: Child Node Id
  - name: next_node_id_nextn
    description: Next Node Id
  - name: hierarchy_level_stufe
    description: Hierarchy Level
  - name: totals_indicator_summe
    description: 'Indicator: Totals'
  - name: change_sign_indicator_sign
    description: Change of Sign (+/-)
  - name: changed_on_date_aedat
    description: Changed on
  - name: changed_by_user_usnam
    description: User Name
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
