description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides a comprehensive and unified view of General Ledger (G/L) accounts at the Chart of
  Accounts level. By joining general account details (such as account category, group, deletion/block
  indicators) with their corresponding multi-language descriptions, it supports financial reporting, GL
  reconciliation, compliance auditing, and general ledger consolidation. The data is captured at the granularity
  of Client (System), Chart Of Accounts, G L Account Number, and Language Key, ensuring a unique audit
  trail for every record.
