displayName: SAP General Ledger Accounts
description: This data product includes information about SAP general ledger accounts
  from the Financial Accounting (FI) module in the Finance domain in SAP S/4HANA or
  SAP ECC. It centralizes Chart of Accounts master records alongside multilingual
  operational definitions. Critical for financial consolidation, it ensures strict
  compliance auditing, trial balance reporting, and unified general ledger analytics.
category: source_aligned_product
type: general_ledger_accounts
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - ska1
      - skat
    modulePath: cortex.sap.foundations.sap
builder: sap_product
