description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides billing document item-level transaction details from SAP VBRP (e.g., material number,
  plant, storage location, billed quantity, net value, cost, and preceding reference documents) to support
  customer profitability and margin reporting. The data is captured at the granularity of Client (System),
  Billing Document, and Item, ensuring a unique audit trail for every record.
