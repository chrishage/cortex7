description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides billing document header-level transaction metadata from SAP VBRK (e.g., company
  code, billing type, net value, tax amount, and billing dates), enriched with calendar date dimensions
  to support revenue recognition forecasting and margin analysis. The data is captured at the granularity
  of Client (System) and Billing Document, ensuring a unique audit trail for every record.
