displayName: SAP Product Hierarchies
description: This data product includes information about SAP product hierarchies
  from the Sales and Distribution (SD), Materials Management (MM) module in the Sales,
  Supply Chain domain in SAP S/4HANA or SAP ECC. This data product provides master
  data and a flattened view of the product hierarchies configured in SAP.
category: source_aligned_product
type: product_hierarchies
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - t179
      - t179t
    modulePath: cortex.sap.foundations.sap
builder: sap_product
