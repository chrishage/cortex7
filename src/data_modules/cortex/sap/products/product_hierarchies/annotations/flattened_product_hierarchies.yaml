description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD), Materials Management
  (MM) module in the Sales, Supply Chain domain and provides Flattened representation of the product hierarchy
  up to 6 levels, showing codes and descriptions for each level. The data is captured at the granularity
  of Client (System), Language Key, Product Hierarchy L1 Prodh1, Product Hierarchy L2 Prodh2, Product
  Hierarchy L3 Prodh3, Product Hierarchy L4 Prodh4, Product Hierarchy L5 Prodh5, and Product Hierarchy
  L6 Prodh6, ensuring a unique audit trail for every record.
catalog_tags:
  - display_name: line_of_business
    fields:
      - display_name: group
        value: Utility
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: language_key_spras
    description: Language Key, PK
  - name: product_hierarchy_l1_prodh1
    description: Product Hierarchy At Level 1, PK
  - name: description_l1_vtext
    description: Description of Level 1 Hierarchy Node
  - name: product_hierarchy_l2_prodh2
    description: Product Hierarchy At Level 2, PK
  - name: description_l2_vtext
    description: Description of Level 2 Hierarchy Node
  - name: product_hierarchy_l3_prodh3
    description: Product Hierarchy At Level 3, PK
  - name: description_l3_vtext
    description: Description of Level 3 Hierarchy Node
  - name: product_hierarchy_l4_prodh4
    description: Product Hierarchy At Level 4, PK
  - name: description_l4_vtext
    description: Description of Level 4 Hierarchy Node
  - name: product_hierarchy_l5_prodh5
    description: Product Hierarchy At Level 5, PK
  - name: description_l5_vtext
    description: Description of Level 5 Hierarchy Node
  - name: product_hierarchy_l6_prodh6
    description: Product Hierarchy At Level 6, PK
  - name: description_l6_vtext
