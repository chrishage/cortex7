displayName: SAP Controlling Documents
description: This data product includes information about SAP controlling documents from the Controlling (CO)
  module in the Finance domain in SAP S/4HANA or SAP ECC. This data product provides
  comprehensive views for SAP Controlling (CO) transactions, including document headers,
  line items, external and internal cost totals, and commitments.
category: source_aligned_product
type: controlling_documents
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - cobk
      - coep
      - cosp
      - coss
      - cooi
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
