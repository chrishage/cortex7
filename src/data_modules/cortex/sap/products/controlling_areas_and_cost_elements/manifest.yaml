displayName: SAP Controlling Areas and Cost Elements
description: This data product includes information about SAP controlling areas and
  cost elements from the Controlling (CO) module in the Finance domain in SAP S/4HANA
  or SAP ECC. It standardizes and exposes SAP controlling areas, company-to-controlling
  area assignments, and cost elements to enable corporate overhead allocation, profitability
  tracking, and cost accounting.
category: source_aligned_product
type: controlling_areas_and_cost_elements
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - tka01
      - tka02
      - cskb
      - csku
    modulePath: cortex.sap.foundations.sap
builder: sap_product
