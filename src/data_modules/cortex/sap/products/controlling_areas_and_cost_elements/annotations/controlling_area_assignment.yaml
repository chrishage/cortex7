description: This view is based on SAP S/4HANA or SAP ECC Controlling (CO) module in the Finance domain
  and provides Maps company codes and business areas to their designated controlling areas from TKA02,
  facilitating cross-company controlling relationships and fiscal consolidation routing. The data is captured
  at the granularity of Client (System), Company Code, and Business Area, ensuring a unique audit trail
  for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: company_code_bukrs
    description: Company Code, PK
  - name: business_area_gsber
    description: Business Area, PK
  - name: controlling_area_kokrs
    description: Controlling Area
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
