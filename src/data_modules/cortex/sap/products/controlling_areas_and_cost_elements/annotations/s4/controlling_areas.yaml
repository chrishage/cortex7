description: This view is based on SAP S/4HANA or SAP ECC Controlling (CO) module in the Finance domain
  and provides master data details about SAP configured controlling areas from TKA01, including standard
  hierarchies, currency settings, chart of accounts, and fiscal year variants, to enable corporate overhead
  allocation. The data is captured at the granularity of Client (System) and Controlling Area, ensuring
  a unique audit trail for every record.
