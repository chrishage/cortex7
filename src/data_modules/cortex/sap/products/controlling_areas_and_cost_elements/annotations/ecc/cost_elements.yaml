description: This view is based on SAP S/4HANA or SAP ECC Controlling (CO) module in the Finance domain
  and provides cost element master definitions from CSKB and CSKU, including valid date ranges, cost element
  categories, planning indicators, and multi-lingual descriptions, to support cost accounting and profitability
  tracking. The data is captured at the granularity of Client (System), Controlling Area, Cost Element,
  Valid To, and Language Key, ensuring a unique audit trail for every record.
