displayName: SAP General Ledger Items
description: This data product includes information about SAP general ledger items from the Financial Accounting
  (FI) module in the Finance domain in SAP ECC. The General Ledger
  Items data product provides a comprehensive, transaction-level view of actual general
  ledger line items from SAP ERP Central Component (ECC). It serves as a high-fidelity
  source of truth for financial reporting, auditing, and ledger-based analytics.
category: source_aligned_product
type: general_ledger_items
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    tables:
      ecc:
      - faglflexa
      common:
      - t001
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
