description: This view is based on SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides General Ledger Actual Line Items The data is captured at the granularity of Client
  (System), Ledger, Company Code, Fiscal Year, Document Number, and Line Item, ensuring a unique audit
  trail for every record.
