displayName: SAP Treasury Positions
description: This data product includes information about SAP treasury positions from the Treasury and Risk
  Management (TRM) module in the Treasury domain in SAP S/4HANA or SAP ECC. The Treasury
  Positions data product provides clean, analytics-ready models for treasury transactions,
  flows, activities, and net present values (NPV) from SAP Treasury and Risk Management
  (TRM).
category: source_aligned_product
type: treasury_positions
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - t001
      - tcurx
      - vtbfha
      - vtbfhapo
      - vtbfhazu
      - vtvbar
    modulePath: cortex.sap.foundations.sap
builder: sap_product
