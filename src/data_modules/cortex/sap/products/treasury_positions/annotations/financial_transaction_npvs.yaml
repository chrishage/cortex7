description: This view is based on SAP S/4HANA or SAP ECC Treasury and Risk Management (TRM) module in
  the Treasury domain and provides Treasury Financial Transaction Net Present Values (NPV) The data is
  captured at the granularity of Client (System), Company Code, Financial Transaction, Contract Number
  Ranlvd, Price Npv Type Okuart, and Effective From Databs, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: contract_type_rantyp
    description: Contract Type
  - name: company_code_bukrs
    description: Company Code, PK
  - name: transaction_rfha
    description: Transaction, PK
  - name: contract_number_ranlvd
    description: Contract Number, PK
  - name: price_npv_type_okuart
    description: Price/Npv Type, PK
  - name: effective_from_databs
    description: Effective From, PK
  - name: net_present_value_barwert
    description: Net Present Value
  - name: currency_of_npv_wbarwert
    description: Currency of Npv
  - name: intrinsic_value_in_document_currency_intrinsic_value
    description: Intrinsic Value in Distribution Center
  - name: time_value_in_display_currency_time_value
    description: Time Value in Display Currency
  - name: clean_price_in_display_currency_clean_price
    description: Clean Price in Display Currency
  - name: npv_of_incoming_side_barwert_in
    description: Npv of Incoming Side
  - name: npv_of_outgoing_side_barwert_out
    description: Npv of Outgoing Side
  - name: risk_free_npv_barwert_rf
    description: Risk-Free Npv
  - name: credit_value_adjustment_cva
