description: This view is based on SAP S/4HANA Sales and Distribution (SD) module in the Sales
  domain and provides Pricing elements (transactional data) containing conditions, rates, and values for
  S/4HANA. The data is captured at the granularity of Client (System), Document Condition Number, Item,
  Step Number, and Counter, ensuring a unique audit trail for every record.
