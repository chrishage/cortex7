description: This view is based on SAP ECC Sales and Distribution (SD) module in the Sales
  domain and provides Sales pricing conditions containing conditions, rates, and values for ECC. The data
  is captured at the granularity of Client (System), Document Condition Number, Item, Step Number, and
  Counter, ensuring a unique audit trail for every record.
