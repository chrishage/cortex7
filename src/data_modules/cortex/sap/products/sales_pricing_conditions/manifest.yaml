displayName: SAP Sales Pricing Conditions
description: This data product includes information about SAP sales pricing conditions from the Sales and Distribution
  (SD) module in the Sales domain in SAP S/4HANA or SAP ECC. It provides a single,
  comprehensive, and consistent view of sales pricing conditions across SAP ECC and
  S/4HANA. It exposes pricing calculation details, rates, currencies, and condition
  values for sales documents.
category: source_aligned_product
type: sales_pricing_conditions
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      ecc:
      - konv
      s4:
      - prcd_elements
    modulePath: cortex.sap.foundations.sap
builder: sap_product
