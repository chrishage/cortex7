description: This view is based on SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides a detailed view of open customer transaction line items from SAP ECC (BSID) to support
  operational tracking and outstanding invoice analysis. The data is captured at the granularity of Client
  (System), Company Code, Customer Number, Accounting Document Number, Fiscal Year, and Document Line
  Item, ensuring a unique audit trail for every record.
