displayName: SAP Delivery Documents
description: This data product includes information about SAP delivery documents from
  the Sales and Distribution (SD) module in the Supply Chain, Sales domain in SAP
  S/4HANA or SAP ECC. It details the logistical flow of outbound and inbound deliveries
  across headers, items, status indicators, and delivery reasons. It supports end-to-end
  supply chain visibility, OTIF (On-Time In-Full) performance tracking, and distribution
  optimization algorithms.
category: source_aligned_product
type: delivery_documents
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - likp
      - lips
      - tcurx
      - tvlst
    modulePath: cortex.sap.foundations.sap
builder: sap_product
