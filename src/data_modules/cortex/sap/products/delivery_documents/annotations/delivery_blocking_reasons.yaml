description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Supply
  Chain, Sales domain and provides language-dependent descriptive names for delivery block reasons from
  SAP TVLST, allowing business analysts to understand the root causes of shipping blocks and holds. The
  data is captured at the granularity of system default keys, ensuring a unique audit trail for every
  record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: language_key_spras
    description: Language Key, PK
  - name: default_delivery_block_lifsp
    description: Default Delivery Block, PK
  - name: delivery_blocking_reason_vtext
    description: Delivery Blocking Reason
  - name: recordstamp
    description: Recordstamp
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
