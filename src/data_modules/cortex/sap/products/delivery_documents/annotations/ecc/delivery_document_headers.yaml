description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Supply
  Chain, Sales domain and provides Serves as the central record of SAP outbound or inbound delivery headers
  from LIKP, tracking logistical and shipping details including creation dates, shipping points, delivery
  types, weights, routing, and shipment release statuses. The data is captured at the granularity of Client
  (System) and Document Number, ensuring a unique audit trail for every record.
