description: This view is based on SAP S/4HANA or SAP ECC Sales and Distribution (SD) module in the Supply
  Chain, Sales domain and provides individual line-item data for SAP deliveries from LIPS, capturing quantities
  delivered, materials, units of measure, plants, net values, and preceding order references for fulfillment
  and invoicing. The data is captured at the granularity of Client (System), Document Number, and Item
  Number, ensuring a unique audit trail for every record.
