displayName: SAP Business Partners
description: This data product includes information about SAP business partners from
  the Financial Accounting (FI), Sales and Distribution (SD), Materials Management
  (MM) module in the Cross-Functional domain in SAP S/4HANA or SAP ECC. The Business
  Partners data product exposes unified, central master data models for SAP Business
  Partners (individuals, organizations, or groups), including physical addresses,
  contact information, and registered bank details.
category: source_aligned_product
type: business_partners
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - adrc
      - adr6
      - adrct
      - but000
      - but020
      - but0bk
    modulePath: cortex.sap.foundations.sap
builder: sap_product
