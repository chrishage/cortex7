description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM) module in the Cross-Functional domain and provides physical addresses,
  contact emails (ADR6), and address remarks (ADRCT) associated with SAP Business Partners from BUT020
  and ADRC to support geographical and communication master data verification. The data is captured at
  the granularity of Client Client, Business Partner Partner, Address Number Addrnumber, and Valid, ensuring
  a unique audit trail for every record.
