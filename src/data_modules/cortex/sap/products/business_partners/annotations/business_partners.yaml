description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM) module in the Cross-Functional domain and provides central master profile
  details for SAP Business Partners (individuals, organizations, or groups) from BUT000, including profile
  categories, roles, and status details to support central partner auditing. The data is captured at the
  granularity of Client Client and Business Partner Partner, ensuring a unique audit trail for every record.
