description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM) module in the Cross-Functional domain and provides financial bank account
  credentials, IBANs, and validity periods for SAP Business Partners from BUT0BK to support payment routing,
  financial operations, and security validation. The data is captured at the granularity of Client Client,
  Business Partner Partner, Bank Details Id, and Valid, ensuring a unique audit trail for every record.
fields:
  - name: client_client
    description: Client (Mandant), PK
  - name: business_partner_partner
    description: Business Partner Number, PK
  - name: bank_details_id_bkvid
    description: Bank Details Id, PK
  - name: valid_from
    description: Valid From Timestamp, PK
  - name: valid_to
    description: Valid to Timestamp
  - name: bank_country_banks
    description: Bank Country Key
  - name: bank_key_bankl
    description: Bank Key
  - name: bank_acct_bankn
    description: Bank Account Number
  - name: bank_control_key_bkont
    description: Bank Control Key
  - name: reference_details_bkref
    description: Reference Details for Bank Details
  - name: account_holder_koinh
    description: Account Holder Name
  - name: extern_bank_dtls_id_bkext
    description: External Bank Details Id
  - name: collection_authorization_xezer
