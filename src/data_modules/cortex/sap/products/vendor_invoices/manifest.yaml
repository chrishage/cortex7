displayName: SAP Vendor Invoices
description: This data product includes information about SAP vendor invoices from
  the Materials Management (MM), Financial Accounting (FI) module in the Finance,
  Supply Chain domain in SAP S/4HANA or SAP ECC. Aggregates accounts payable invoice
  lifecycle logs, capturing document headers, logistical matching criteria, and processing
  statuses. Facilitates AP automation auditing, cash discount realization tracking,
  and payment run efficiency modeling.
category: source_aligned_product
type: vendor_invoices
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - rbco
      - rbkp
      - rseg
    modulePath: cortex.sap.foundations.sap
builder: sap_product
