description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM), Financial Accounting
  (FI) module in the Finance, Supply Chain domain and provides line-item details of supplier incoming
  invoices from SAP RSEG, tracking invoiced quantities, materials, and purchase order references. The
  data is captured at the granularity of Client (System), Invoice Document Number, Fiscal Year, and Invoice
  Item, ensuring a unique audit trail for every record.
