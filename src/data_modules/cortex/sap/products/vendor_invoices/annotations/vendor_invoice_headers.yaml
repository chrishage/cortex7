description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM), Financial Accounting
  (FI) module in the Finance, Supply Chain domain and provides a unified header-level transaction view
  of supplier incoming invoices from SAP RBKP, enabling auditing of gross amounts, tax details, and cash
  discounts. The data is captured at the granularity of Client (System), Invoice Document Number, and
  Fiscal Year, ensuring a unique audit trail for every record.
