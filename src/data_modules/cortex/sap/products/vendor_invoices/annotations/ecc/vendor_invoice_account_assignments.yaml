description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM), Financial Accounting
  (FI) module in the Finance, Supply Chain domain and provides financial account assignments for invoice
  line items from SAP RBCO, mapping transactions directly to cost centers, profit centers, G/L accounts,
  and WBS elements. The data is captured at the granularity of Client (System), Invoice Document Number,
  Fiscal Year, Invoice Item, Sequential Number Account Assignment, and Sequential Number Cobl, ensuring
  a unique audit trail for every record.
