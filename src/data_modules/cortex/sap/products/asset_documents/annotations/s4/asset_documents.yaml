description: This view is based on SAP S/4HANA Financial Accounting (FI) module in the Finance
  domain and provides Asset Documents (S/4HANA) - Captures asset posting ledger transactions from the
  SAP S/4HANA Universal Journal (ACDOCA) joined with BKPF (such as asset number, depreciation area, transaction
  type, posted amounts in local and transaction currencies, and document metadata), filtered by asset
  account type ('A') and enriched with calendar date dimensions. The data is captured at the granularity
  of system default keys, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: company_code_bukrs
    description: Company Code, PK
  - name: accounting_document_number_belnr
    description: Accounting Document Number, PK
  - name: fiscal_year_gjahr
    description: Fiscal Year, PK
  - name: accounting_document_line_item_buzei
    description: Number of Line Item Within Accounting Document, PK
  - name: asset_number_anln1
    description: Asset Number
  - name: asset_subnumber_anln2
    description: Asset Subnumber
  - name: depreciation_area_afabe
    description: Depreciation Area
  - name: transaction_type_bwasl
    description: Asset Transaction Type
  - name: amount_posted_in_local_currency_hsl
    description: Amount Posted in Local Currency
  - name: amount_posted_in_transaction_currency_wsl
    description: Amount Posted in Transaction Currency
  - name: local_currency_key_rhcur
