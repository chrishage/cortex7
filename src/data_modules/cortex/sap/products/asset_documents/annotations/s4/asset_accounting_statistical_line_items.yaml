description: This view is based on SAP S/4HANA Financial Accounting (FI) module in the Finance
  domain and provides Asset Accounting Statistical Line Items (S/4HANA) - Captures statistical line items
  for asset postings from the SAP S/4HANA FAAT_DOC_IT table, including asset number, depreciation area,
  transaction type, posted amounts in company code and global currencies, and document metadata, enriched
  with calendar date dimensions. The data is captured at the granularity of system default keys, ensuring
  a unique audit trail for every record.
