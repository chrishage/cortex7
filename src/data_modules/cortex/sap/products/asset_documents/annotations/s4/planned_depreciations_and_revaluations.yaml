description: This view is based on SAP S/4HANA Financial Accounting (FI) module in the Finance
  domain and provides Planned Depreciations and Revaluations (S/4HANA) - Captures planned depreciation
  values and revaluations from the SAP S/4HANA FAAT_PLAN_VALUES table, including asset number, depreciation
  area, posting period, and planned amounts in company code and global currencies. The data is captured
  at the granularity of system default keys, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: company_code_bukrs
    description: Company Code, PK
  - name: asset_number_anln1
    description: Asset Number, PK
  - name: asset_subnumber_anln2
    description: Asset Subnumber, PK
  - name: fiscal_year_gjahr
    description: Fiscal Year, PK
  - name: depreciation_area_afabe
    description: Depreciation Area, PK
  - name: posting_period_poper
    description: Posting Period, PK
  - name: sla_line_item_type_slalittype
    description: Subledger Accounting Line Item Type, PK
  - name: ledger_group_ldgrp
    description: Ledger Group
  - name: group_asset_anlgr
    description: Group Asset
  - name: group_asset_subnumber_anlgr2
    description: Group Asset Subnumber
  - name: transaction_type_category_movcat
    description: Transaction Type Category
  - name: amount_posted_in_company_code_currency_hsl
    description: Amount Posted in Company Code Currency
  - name: amount_posted_in_global_currency_ksl
    description: Amount Posted in Global Currency
  - name: company_code_currency_rhcur
    description: Company Code Currency Key
  - name: global_currency_rkcur
