description: This view is based on SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides Asset Document Line Items (ECC) - Captures asset posting document line item-level
  transaction metadata from SAP ANEP (such as depreciation area, transaction type, posted amount, ordinary
  depreciation, and interest), enriched with calendar date dimensions to support asset valuation and depreciation
  analysis. The data is captured at the granularity of system default keys, ensuring a unique audit trail
  for every record.
