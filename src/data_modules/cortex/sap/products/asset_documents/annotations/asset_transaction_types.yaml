description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides Asset Transaction Types details the business transaction types used in asset accounting,
  including capitalization flags, retirement rules, and group mappings. The data is captured at the granularity
  of system default keys, ensuring a unique audit trail for every record.
