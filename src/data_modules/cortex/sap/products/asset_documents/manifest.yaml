displayName: SAP Asset Documents
description: This data product includes information about SAP asset documents from the Financial Accounting
  (FI) module in the Finance domain in SAP S/4HANA or SAP ECC. The Asset Documents
  data product provides structured models for asset accounting, allowing enterprise
  analysis of asset transaction types, postings, and master data configurations. It
  serves as a foundational component for asset lifecycle tracking and financial reporting.
category: source_aligned_product
type: asset_documents
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - tabw
      - tabwh
      - tabwt
      - tcurx
      ecc:
      - anek
      - anep
      - anlc
      - t001
      s4:
      - bkpf
      - acdoca
      - faat_ydda
      - faat_doc_it
      - faat_plan_values
    modulePath: cortex.sap.foundations.sap
builder: sap_product
