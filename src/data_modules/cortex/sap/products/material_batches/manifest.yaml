displayName: SAP Material Batches
description: This data product includes information about SAP material batches from
  the Materials Management (MM) module in the Supply Chain domain in SAP S/4HANA or
  SAP ECC. The `material_batches` data product serves as the consolidated repository
  for all SAP material batch management and inventory stock levels. It provides comprehensive
  visibility into batch master records at both the cross-plant (client) and plant
  levels, alongside real-time batch stock quantities at specific storage locations.
category: source_aligned_product
type: material_batches
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - mch1
      - mcha
      - mchb
      - makt
      - t001w
    modulePath: cortex.sap.foundations.sap
builder: sap_product
