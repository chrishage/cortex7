description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides Central cross-plant registry for SAP material batches from MCH1, tracking
  universal batch details such as manufacturing and expiration dates, shelf life properties, supplier
  references, and batch status. The data is captured at the granularity of Client (System), Material Number,
  Batch Number, and Language Key, ensuring a unique audit trail for every record.
