description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides physical batch stock quantities per plant and storage location from SAP MCHB,
  including unrestricted, blocked, in-transit, restricted, and returns stock volumes. The data is captured
  at the granularity of Client (System), Material Number, Plant, Storage Location, Batch Number, and Language
  Key, ensuring a unique audit trail for every record.
