displayName: SAP Inventory and Special Stocks
description: This data product includes information about SAP inventory and special stocks from the Materials Management
  (MM), Sales and Distribution (SD) module in the Supply Chain, Sales domain in SAP
  ECC. The Inventory & Special Stocks data product provides detailed
  insights into specialized stock types and customer/vendor allocations within the
  supply chain. It consolidates sales order stock, customer-consigned/special stocks,
  and vendor-managed special stocks.
category: source_aligned_product
type: inventory_and_special_stocks
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    tables:
      ecc:
      - mska
      - msfd
      - mkol
      - mslb
      - t148t
      - msku
    modulePath: cortex.sap.foundations.sap
builder: sap_product
