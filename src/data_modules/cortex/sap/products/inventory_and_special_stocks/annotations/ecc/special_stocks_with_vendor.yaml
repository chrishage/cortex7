description: This view is based on SAP ECC Materials Management (MM), Sales and Distribution
  (SD) module in the Supply Chain, Sales domain and provides Vendor special stocks with descriptive indicator
  labels. The data is captured at the granularity of Client (System), Material, Plant, Batch, Special
  Stock Indicator, Vendor, and Language Key, ensuring a unique audit trail for every record.
