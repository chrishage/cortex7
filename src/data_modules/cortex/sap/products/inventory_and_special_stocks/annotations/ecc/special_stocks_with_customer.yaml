description: This view is based on SAP ECC Materials Management (MM), Sales and Distribution
  (SD) module in the Supply Chain, Sales domain and provides Special stock consigned or placed at customer
  sites. The data is captured at the granularity of Client (System), Material, Plant, Batch, Special Stock
  Indicator, and Customer, ensuring a unique audit trail for every record.
