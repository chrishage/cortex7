description: This view is based on SAP ECC Materials Management (MM), Sales and Distribution
  (SD) module in the Supply Chain, Sales domain and provides Sales order stock specifically allocated
  with vendor information. The data is captured at the granularity of Client (System), Material, Plant,
  Batch, Special Stock Indicator, Vendor, Sales Document, and Sales Document Item, ensuring a unique audit
  trail for every record.
