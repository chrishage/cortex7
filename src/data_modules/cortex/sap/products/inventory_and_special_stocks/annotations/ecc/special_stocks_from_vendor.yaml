description: This view is based on SAP ECC Materials Management (MM), Sales and Distribution
  (SD) module in the Supply Chain, Sales domain and provides Special stock owned/consigned by vendors.
  The data is captured at the granularity of Client (System), Material, Plant, Storage Location, Batch,
  Special Stock Indicator, and Vendor, ensuring a unique audit trail for every record.
