description: This view is based on SAP ECC Materials Management (MM), Sales and Distribution
  (SD) module in the Supply Chain, Sales domain and provides Material stock allocated to specific sales
  orders. The data is captured at the granularity of Client (System), Material, Plant, Storage Location,
  Batch, Special Stock Indicator, Sales Document, and Sales Document Item, ensuring a unique audit trail
  for every record.
