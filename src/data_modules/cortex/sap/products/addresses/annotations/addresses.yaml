description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM) module in the Cross-Functional domain and provides a centralized, globally
  consistent master data view of geographical and communication addresses for business partners, customers,
  vendors, and organizational units (from ADRC, ADR6, and ADRCT) to support geospatial analytics and supply-chain
  routing. The data is captured at the granularity of Client (System), Address Number Addrnumber, Language
  Key, Person Number Persnumber, and Sequence Number Consnumber, ensuring a unique audit trail for every
  record.
