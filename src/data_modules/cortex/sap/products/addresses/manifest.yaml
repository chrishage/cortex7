displayName: SAP Addresses
description: This data product includes information about SAP addresses from the Financial
  Accounting (FI), Sales and Distribution (SD), Materials Management (MM) module in
  the Cross-Functional domain in SAP S/4HANA or SAP ECC. It offers a centralized and
  globally consistent view of geographical and communication addresses for business
  partners, customers, and organizational units. It enables geospatial analytics,
  supply-chain routing optimization, and high-fidelity customer master data consolidation.
category: source_aligned_product
type: addresses
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - adrc
      - adr6
      - adrct
    modulePath: cortex.sap.foundations.sap
builder: sap_product
