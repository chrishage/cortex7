description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM), Controlling (CO), Production Planning (PP), Project System (PS) module
  in the Cross-Functional domain and provides country-specific master records from SAP T005 and T005T
  containing localized names, formatting standards, regional settings, and international code mappings
  to enable international trading analytics. The data is captured at the granularity of Client (System),
  Country Key, and Language Key, ensuring a unique audit trail for every record.
