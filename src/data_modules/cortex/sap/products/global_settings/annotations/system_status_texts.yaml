description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM), Controlling (CO), Production Planning (PP), Project System (PS) module
  in the Cross-Functional domain and provides language-dependent status texts for system statuses from
  SAP TJ02T to enable localized status mappings. The data is captured at the granularity of System Status
  and Language Key, ensuring a unique audit trail for every record.
fields:
  - name: status_key_istat
    description: System Status Key, PK
  - name: language_key_spras
    description: Language Key, PK
  - name: status_code_txt04
    description: Individual Status Short Description
  - name: status_name_txt30
    description: Status Text / Long Description
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
