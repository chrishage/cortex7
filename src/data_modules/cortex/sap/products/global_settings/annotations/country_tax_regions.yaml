description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM), Controlling (CO), Production Planning (PP), Project System (PS) module
  in the Cross-Functional domain and provides Stores state, provincial, and regional master details from
  SAP T005S and T005U alongside language-specific descriptions to enable regional tax key lookups. The
  data is captured at the granularity of Client (System), Country Key, Region, and Language Key, ensuring
  a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: country_key_land1
    description: Country Key, PK
  - name: region_bland
    description: Region Key (State / Province / County), PK
  - name: language_key_spras
    description: Language Key, PK
  - name: region_name_bezei
    description: Region / State / Province Description
  - name: provincial_tax_code_fprcd
    description: Provincial Tax Code
  - name: state_of_manufacture_herbl
    description: State of Manufacture
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
