description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM), Controlling (CO), Production Planning (PP), Project System (PS) module
  in the Cross-Functional domain and provides the core enterprise structures by providing company definitions
  from SAP T001, detailing organizational locations, base currency identifiers, charts of accounts, and
  active fiscal year variants. The data is captured at the granularity of Client (System) and Company
  Code, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: company_code_bukrs
    description: Company Code, PK
  - name: currency_code_waers
    description: Currency Key
  - name: company_text_butxt
    description: Name of the Company Code
  - name: city_name_ort01
    description: City
  - name: country_land1
    description: Country Key
  - name: language_spras
    description: Language Key
  - name: chart_of_accounts_ktopl
    description: Chart of Accounts
  - name: fiscal_year_variant_periv
    description: Fiscal Year Variant
  - name: company_rcomp
    description: Company
  - name: credit_control_area_kkber
    description: Credit Control Area
  - name: country_chart_of_accounts_ktop2
    description: Country Chart of Accounts
  - name: funds_management_fikrs
    description: Financial Management Area
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
