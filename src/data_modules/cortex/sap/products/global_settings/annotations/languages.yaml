description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI), Sales and Distribution
  (SD), Materials Management (MM), Controlling (CO), Production Planning (PP), Project System (PS) module
  in the Cross-Functional domain and provides a system-wide language dictionary from SAP T002 and T002T
  mapping language keys to standardized names to support multilingual localized reporting settings. The
  data is captured at the granularity of Language Key and Language Key, ensuring a unique audit trail
  for every record.
fields:
  - name: language_key_spras
    description: Language Key, PK
  - name: iso_code_laiso
    description: Language Iso Code
  - name: description_language_sprsl
    description: Description Language, PK
  - name: language_name_sptxt
    description: Name of the Language
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
