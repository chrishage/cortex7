description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides Ledger Master details containing ledger characteristics and language-specific names
  The data is captured at the granularity of system default keys, ensuring a unique audit trail for every
  record.
