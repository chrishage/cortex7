description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides a standardized, global dictionary of active currency codes from SAP TCURC, TCURT,
  and TCURX, translating raw technical codes into standard ISO-4217 references with accurate decimal configurations
  and multilingual names. The data is captured at the granularity of Client (System), Currency Key, and
  Language Key, ensuring a unique audit trail for every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: currency_code_waers
    description: Currency Key, PK
  - name: currency_iso_isocd
    description: Iso Code
  - name: currency_decimals_currdec
    description: Number of Decimal Places
  - name: language_spras
    description: Language Key, PK
  - name: curr_short_text_ktext
    description: Short Text
  - name: curr_long_text_ltext
    description: Long Text
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
