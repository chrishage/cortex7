description: This view is based on SAP S/4HANA or SAP ECC Financial Accounting (FI) module in the Finance
  domain and provides Delivers daily, fully-expanded conversion exchange rates between currency pairs
  from SAP TCURR and TCURF, enabling accurate financial conversions for cross-border transactions and
  consolidated financial auditing. The data is captured at the granularity of Client (System), Exchange
  Rate Type, From Currency, To Currency, and Exchange Rate Effective, ensuring a unique audit trail for
  every record.
fields:
  - name: client_mandt
    description: Client (Mandant), PK
  - name: exchange_rate_type_kurst
    description: Exchange Rate Type, PK
  - name: from_currency_fcurr
    description: From Currency, PK
  - name: to_currency_tcurr
    description: To Currency, PK
  - name: exchange_rate_ukurs
    description: Exchange Rate
  - name: start_date
    description: Start Date of Validity
  - name: end_date
    description: End Date of Validity
  - name: conv_date
    description: Conversion Date (Expanded), PK
  - name: source_last_updated_at
    description: Source Last Updated At
  - name: bq_loaded_at
    description: Bigquery Loaded At
