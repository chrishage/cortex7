displayName: SAP Treasury Market Data
description: This data product includes information about SAP treasury market data from the Treasury and Risk
  Management (TRM) module in the Treasury domain in SAP S/4HANA or SAP ECC. It integrates
  treasury market data from SAP, providing a comprehensive view of security classes
  (master data) and their corresponding daily market prices. Serves as the foundation
  for treasury management, portfolio valuation, risk analysis, and financial reporting.
category: source_aligned_product
type: treasury_market_data
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - vwpanla
      - atras
    modulePath: cortex.sap.foundations.sap
builder: sap_product
