schema: cortex
name: security_classes
description: This view is based on SAP S/4HANA or SAP ECC Treasury and Risk Management (TRM) module in
  the Treasury domain and provides Represents security master data, including names, product types, issuers,
  and classification details. The data is captured at the granularity of Client (System) and Security
  Class Id Number, ensuring a unique audit trail for every record.
