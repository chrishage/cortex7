description: This view is based on SAP S/4HANA or SAP ECC Production Planning (PP) module in the Manufacturing
  domain and provides BOM item/component details, including component quantities, scrap percentages, and
  item categories. The data is captured at the granularity of system default keys, ensuring a unique audit
  trail for every record.
