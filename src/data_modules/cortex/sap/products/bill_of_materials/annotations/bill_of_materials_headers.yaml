description: This view is based on SAP S/4HANA or SAP ECC Production Planning (PP) module in the Manufacturing
  domain and provides BOM header details including validity dates, base quantities, and BOM status. The
  data is captured at the granularity of system default keys, ensuring a unique audit trail for every
  record.
