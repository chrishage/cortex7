displayName: SAP Bill of Materials
description: This data product includes information about SAP bill of materials from
  the Production Planning (PP) module in the Manufacturing domain in SAP S/4HANA or
  SAP ECC. It provides a comprehensive and structured view of Bill of Materials (BOM)
  data, covering BOM headers, BOM items, and BOM item selections. This data product
  serves manufacturing analytics, production planning, inventory management, and cost
  roll-up calculations in SAP ERP environments.
category: source_aligned_product
type: bill_of_materials
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - stko
      - stpo
      - stas
    modulePath: cortex.sap.foundations.sap
builder: sap_product
