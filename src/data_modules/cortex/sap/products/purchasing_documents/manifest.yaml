displayName: SAP Purchasing Documents
description: This data product includes information about SAP purchasing documents
  from the Materials Management (MM) module in the Supply Chain domain in SAP S/4HANA
  or SAP ECC. It tracks enterprise procurement activity spanning purchase orders,
  scheduling agreements, and contract frameworks. It yields critical insights into
  supplier lead-time compliance, spending analytics, and automated procurement workflow
  efficiency.
category: source_aligned_product
type: purchasing_documents
dependencies:
  sapModule:
    supportedVersions:
    - ecc
    - s4
    tables:
      common:
      - ekko
      - ekpo
      - eket
      - ekbe
      - ekes
      - ekkn
      - t161
      - t161t
      - tcurx
    modulePath: cortex.sap.foundations.sap
builder: sap_product
