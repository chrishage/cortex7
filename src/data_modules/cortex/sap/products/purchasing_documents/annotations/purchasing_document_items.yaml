description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides Manages detailed transactional item lines from SAP EKPO, representing ordered
  materials, quantities, pricing components, plants, and account assignment references. The data is captured
  at the granularity of Client (System), Purchasing Document Number, and Item Number Of Purchasing Document,
  ensuring a unique audit trail for every record.
