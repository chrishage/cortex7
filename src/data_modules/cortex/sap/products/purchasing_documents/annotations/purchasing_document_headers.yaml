description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides administrative and commercial terms of SAP purchase orders, scheduling agreements,
  and contracts from EKKO, maintaining transaction dates, vendors, currencies, and payment terms. The
  data is captured at the granularity of Client (System) and Purchasing Document Number, ensuring a unique
  audit trail for every record.
