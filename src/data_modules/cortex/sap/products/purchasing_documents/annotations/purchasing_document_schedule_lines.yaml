description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides logistical delivery schedules from SAP EKET, specifying delivery dates, scheduled
  quantities, and received/issued quantities for each item line. The data is captured at the granularity
  of Client (System), Purchasing Document Number, Item Number Of Purchasing Document, and Schedule Line
  Number, ensuring a unique audit trail for every record.
