description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides the configuration of purchasing document types and their descriptions from
  T161 and T161T. The data is captured at the granularity of Client (System), Purchasing Document Category,
  Purchasing Document Type, and Language Key, ensuring a unique audit trail for every record.
