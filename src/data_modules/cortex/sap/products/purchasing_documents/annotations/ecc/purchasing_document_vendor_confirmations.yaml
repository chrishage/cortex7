description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides Manages vendor confirmation details from EKES. The data is captured at the
  granularity of Client (System), Purchasing Document, Item, and Sequential Number, ensuring a unique
  audit trail for every record.
