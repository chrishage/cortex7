description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides the account assignments for purchasing document items from EKKN. The data
  is captured at the granularity of Client (System), Purchasing Document, Item, and Sequence Number Of
  Account Assgt, ensuring a unique audit trail for every record.
