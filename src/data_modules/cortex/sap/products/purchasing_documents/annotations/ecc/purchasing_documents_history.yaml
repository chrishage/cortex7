description: This view is based on SAP S/4HANA or SAP ECC Materials Management (MM) module in the Supply
  Chain domain and provides the historical transactions and updates for purchasing documents from EKBE.
  The data is captured at the granularity of Client (System), Purchasing Document, Item, Seq No Of Account
  Assgt, Trans Event Type, Material Doc Year, Material Document, and Material Doc Item, ensuring a unique
  audit trail for every record.
