displayName: Sales Performance
description: This data product includes information about sales performance
  and is based on SAP S/4HANA data shared through SAP Business Data Cloud
  (SAP BDC) catalog sharing. It combines data from multiple SAP BDC data
  products to provide a comprehensive view of sales performance.
category: consumption_product
type: sales_performance
dependencies:
  sapBdcCustomer:
    modulePath: sap_bdc.customer
  sapBdcSalesOrder:
    modulePath: sap_bdc.salesorder
builder: sap_bdc_product
