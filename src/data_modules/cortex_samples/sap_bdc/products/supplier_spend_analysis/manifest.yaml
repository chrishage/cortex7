displayName: Supplier Spend Analysis
description: This data product includes information about supplier spend
  and is based on SAP S/4HANA data shared through SAP Business Data Cloud
  (SAP BDC) catalog sharing. It combines data from multiple SAP BDC data
  products to provide a comprehensive view of supplier spend.
category: consumption_product
type: supplier_spend_analysis
dependencies:
  sapBdcSupplier:
    modulePath: sap_bdc.supplier
  sapBdcProcurementConfigurationData:
    modulePath: sap_bdc.procurementconfigurationdata
  sapBdcPurchasingOrganization:
    modulePath: sap_bdc.purchasingorganization
  sapBdcPurchaseOrder:
    modulePath: sap_bdc.purchaseorder
builder: sap_bdc_product
  