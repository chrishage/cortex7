displayName: Sales Performance
description: This data product includes information about sales performance
  from the Sales and Distribution (SD) module in SAP S/4HANA or
  SAP ECC. This data product provides a comprehensive view of sales performance across
  the organization. It integrates data from various foundational SAP data products to enable strategic
  sales insights and performance analysis.
category: consumption_product
type: sales_performance
dependencies:
  sapCustomers:
    modulePath: cortex.sap.products.customers
  sapSalesDocuments:
    modulePath: cortex.sap.products.sales_documents
  sapDeliveryDocuments:
    modulePath: cortex.sap.products.delivery_documents
  sapSalesOrganizationalStructure:
    modulePath: cortex.sap.products.sales_organizational_structure
  sapMaterials:
    modulePath: cortex.sap.products.materials
builder: sap_product