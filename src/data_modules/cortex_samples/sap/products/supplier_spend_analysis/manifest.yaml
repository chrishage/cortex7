displayName: Supplier Spend Analysis
description: This data product includes information about supplier spend analysis
  from the Materials Management (MM) module in the Supply Chain domain in SAP S/4HANA or
  SAP ECC. This data product provides a comprehensive view of supplier spend across
  the organization. It integrates data from various foundational SAP data products to enable strategic
  procurement insights and supplier performance analysis.
category: consumption_product
type: supplier_spend_analysis
dependencies:
  sapMaterials:
    modulePath: cortex.sap.products.materials
  sapPurchasingDocuments:
    modulePath: cortex.sap.products.purchasing_documents
  sapPurchasingOrganizationalStructure:
    modulePath: cortex.sap.products.purchasing_organizational_structure
  sapVendors:
    modulePath: cortex.sap.products.vendors
builder: sap_product