ecc:
  nota_fiscal_items:
    materializationType: incremental
    bigQueryLabels:
    - key: line_of_business
      value: sales
    - key: sap_module
      value: sap_sd
    - key: data_class
      value: transactional
    dataformTags: [sap, sales, sap_sd, custom_tramontina, transactional, hourly]
    partitionDetails:
      partitionType: time
      column: docnum_date_docnum_date
    clusterDetails:
      columns:
        - nota_fiscal_document_docnum
