buildEnvironment:
  buildProjectId: cortex-connector-test
data:
  bigQueryLocation: US
  datasets:
    - id: sap_raw
      projectId: cortex-connector-test
      datasetId: CORTEX_SAP_RAW
    - id: sap_raw_s4
      projectId: cortex-connector-test
      datasetId: CORTEX_SAP_RAW_S4
    - id: sap_foundation
      projectId: cortex-connector-test
      datasetId: CORTEX7_SAP_DATA_FOUNDATION
    - id: sap_foundation_s4
      projectId: cortex-connector-test
      datasetId: CORTEX7_SAP_DATA_FOUNDATION_S4
    - id: product_target
      projectId: cortex-connector-test
      datasetId: CORTEX7_DEVELOPMENT_PRODUCT
  namespaces:
    - name: cortex
      path: ../src/data_modules/cortex
  modules:
    catalogs:
    - id: sap_bdc_catalog
      type: lakehouse_delta_share
      bindsNamespaces: [sap_bdc]
      enabled: true
      connectionSettings:
        catalogId: sap_bdc_catalog
        projectId: kittycorn-dev-five
        location: europe-west3
        shares:
        - shareId: purchasecontract_v1_he4_400_p8111
        - shareId: customer_v1_he4_400_p8111  
    foundations:
      - moduleId: erp
        modulePath: cortex.sap.foundations.sap
        dataSourceId: sap_raw
        dataTargetId: sap_foundation
        moduleSettings:
          sapVersion: ecc
          mandt: "100"
      - moduleId: erp_s4
        modulePath: cortex.sap.foundations.sap
        dataSourceId: sap_raw_s4
        dataTargetId: sap_foundation_s4
        moduleSettings:
          sapVersion: s4
          mandt: "250"
    products:
      - moduleId: sap_plants_and_storage
        modulePath: cortex.sap.products.plants_and_storage
        dependencyBindings:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_treasury_market_data
        modulePath: cortex.sap.products.treasury_market_data
        dependencyBindings:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_purchasing_organizational_structure
